<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>디지털 서커스 v0</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=VT323&display=swap">
<style>
/* Layout: one-screen VHS player — low-res canvas stage on top, dialogue tape below. Single dark look by choice. */
:root{
  --bg:#07060a; --tape:#0f0d14; --fg:#e9e4d8; --dim:#8d8697;
  --warm:#f2b25c; --ring:#e2524a; --seo:#9fd8c9; --sys:#7cff8a; --line:#2a2433;
  --f-body:"Nanum Gothic Coding", ui-monospace, "Apple SD Gothic Neo", monospace;
  --f-osd:"VT323", ui-monospace, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:10px;user-select:none;-webkit-user-select:none;box-sizing:border-box}
#stage{position:relative;flex:0 0 auto;width:100%;height:min(54vh,118vw);background:#000;overflow:hidden;border-radius:3px}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#noise{opacity:.12;mix-blend-mode:screen}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%)}
#dark{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .08s linear;pointer-events:none}
.osd{position:absolute;font-family:var(--f-osd);font-size:20px;letter-spacing:1px;color:#fff;text-shadow:2px 0 rgba(255,0,60,.6),-2px 0 rgba(0,200,255,.5);pointer-events:none}
#osdL{left:10px;top:6px} #osdR{right:10px;top:6px} #osdB{left:10px;bottom:6px;color:var(--sys)}
#stage.shake{animation:shake .35s steps(6) 1}
#stage.rgb canvas#scene{filter:contrast(1.3) saturate(1.6) hue-rotate(25deg)}
@keyframes shake{0%{transform:translate(0,0)}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,4px)}80%{transform:translate(4px,0)}100%{transform:translate(0,0)}}
#tape{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px}
#box{position:relative;flex:1 1 auto;min-height:96px;background:var(--tape);border:1px solid var(--line);border-radius:3px;padding:14px 14px 26px;overflow-y:auto;cursor:pointer}
#who{font-family:var(--f-osd);font-size:19px;letter-spacing:1.5px;color:var(--dim);margin-bottom:4px;min-height:19px}
#txt{font-size:16px;line-height:1.7;white-space:pre-wrap;word-break:keep-all}
#txt.seo{color:var(--seo)} #txt.ring{color:var(--ring);font-weight:700} #txt.msg{color:var(--fg)} #txt.sys{color:var(--sys);font-family:var(--f-osd);font-size:22px}
.bubble{display:inline-block;background:#fee500;color:#191600;border-radius:4px 14px 14px 14px;padding:8px 12px;font-size:15px}
#more{position:absolute;right:12px;bottom:6px;font-family:var(--f-osd);font-size:18px;color:var(--dim);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#choices{display:flex;flex-direction:column;gap:8px}
[hidden]{display:none!important}
#choices > button,.btn{font:inherit;font-size:15px;text-align:left;color:var(--fg);background:#16131c;border:1px solid #3a3346;border-radius:3px;padding:12px 14px;cursor:pointer}
#choices > button:hover,#choices > button:focus-visible,.btn:hover,.btn:focus-visible{border-color:var(--warm);outline:none;color:#fff}
#choices > button::before{content:"▶ ";color:var(--warm);font-family:var(--f-osd)}
#timer{height:3px;background:var(--ring);transform-origin:left;}
/* title & end */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center;background:rgba(7,6,10,.82);z-index:5}
.ticket{border:2px dashed var(--warm);padding:16px 22px;color:var(--warm);font-family:var(--f-osd);letter-spacing:2px;transform:rotate(-2deg)}
.ticket b{display:block;font-size:40px;line-height:1}
.ticket span{font-size:18px}
.note{color:var(--dim);font-size:13px;line-height:1.6}
.btn.primary{background:var(--warm);color:#1a1205;border-color:var(--warm);font-weight:700;text-align:center}
#endpanel{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;padding:7px 10px;border-radius:14px;border:1px solid #3a3346;background:#16131c;color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ring);border-color:var(--ring);color:#fff}
#copyout{font-size:13px;color:var(--dim);white-space:pre-wrap;background:#0b0a0f;border:1px solid var(--line);padding:10px;border-radius:3px;user-select:text;-webkit-user-select:text}
@media (prefers-reduced-motion:reduce){#stage.shake{animation:none}#more{animation:none}}
</style>
</head><body>
<div id="app">
  <div id="stage">
    <canvas id="scene" width="120" height="150"></canvas>
    <canvas id="noise" width="120" height="150"></canvas>
    <div id="dark"></div>
    <div id="scan"></div><div id="vig"></div>
    <div class="osd" id="osdL">▶ PLAY</div>
    <div class="osd" id="osdR">SP 00:00:00</div>
    <div class="osd" id="osdB"></div>
    <div class="screen" id="title">
      <div class="ticket"><span>ADMIT ONE · 1매</span><b>CIRCUS</b><span>오늘 밤 8시 · 자유석</span></div>
      <div class="note">이어폰 권장 · 약 5분<br>화면이나 글 상자를 누르면 다음으로 넘어가</div>
      <button class="btn primary" id="startBtn">입장하기 (소리 켜짐)</button>
    </div>
  </div>
  <div id="tape">
    <div id="box" tabindex="0" aria-live="polite"><div id="who"></div><div id="txt"></div><div id="more" hidden>▼</div></div>
    <div id="timer" hidden></div>
    <div id="choices"></div>
  </div>
</div>

<script>
/* ================= AUDIO ================= */
const A = {ctx:null, master:null, music:null, hum:null, hb:null, pad:null, detune:0, rate:1, noiseBuf:null, clapBuf:null};
function audioInit(){
  const C = new (window.AudioContext||window.webkitAudioContext)();
  A.ctx=C; A.master=C.createGain(); A.master.gain.value=.8; A.master.connect(C.destination);
  const n=C.createBuffer(1,C.sampleRate*2,C.sampleRate), d=n.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  A.noiseBuf=n;
  // applause buffer generated ONCE with a fixed seed -> every replay is identical
  let s=7; const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647};
  const len=C.sampleRate*2.4, cb=C.createBuffer(1,len,C.sampleRate), cd=cb.getChannelData(0);
  for(let k=0;k<420;k++){const at=Math.floor(Math.pow(rnd(),.7)*len*.85), dur=Math.floor(C.sampleRate*(.006+rnd()*.01)), amp=.25+rnd()*.6;
    for(let i=0;i<dur&&at+i<len;i++) cd[at+i]+= (rnd()*2-1)*amp*Math.exp(-i/(dur*.3));}
  for(let i=0;i<len;i++) cd[i]*=Math.min(1,i/(C.sampleRate*.15))*Math.min(1,(len-i)/(C.sampleRate*.9));
  A.clapBuf=cb;
}
function env(g,t,a,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);}
function tone(freq,t,dur,type='square',vol=.06,dest=A.master,det=0){
  const C=A.ctx,o=C.createOscillator(),g=C.createGain(),f=C.createBiquadFilter();
  o.type=type;o.frequency.value=freq;o.detune.value=det;f.type='lowpass';f.frequency.value=2200;
  o.connect(f);f.connect(g);g.connect(dest);env(g,t,.01,vol,dur);o.start(t);o.stop(t+dur+.05);return o;
}
// waltz melody (calliope): [semitone from C5 or null, beats]
const MEL=[[7,1],[4,1],[4,1],[5,1],[2,1],[2,1],[0,1],[2,1],[4,1],[5,1],[7,1],[7,1],[7,1],[4,1],[4,1],[5,1],[2,1],[2,1],[0,1],[4,1],[7,1],[0,3]];
const BASS=[0,7,5,7];
function musicStart(){
  musicStop(); const C=A.ctx; let i=0,bar=0,next=C.currentTime+.1;
  A.music={timer:setInterval(()=>{
    while(next<C.currentTime+.25){
      const beat=60/150/A.rate, [st,b]=MEL[i%MEL.length];
      if(st!==null){ tone(523.25*Math.pow(2,st/12),next,beat*b*.9,'square',.035,A.master,A.detune);
                     tone(523.25*Math.pow(2,(st+12)/12),next,beat*b*.6,'triangle',.02,A.master,A.detune*1.7); }
      if(i%3===0){ tone(130.8*Math.pow(2,BASS[bar%4]/12),next,beat*.8,'triangle',.07,A.master,A.detune*.5); bar++; }
      else tone(261.6*Math.pow(2,(BASS[bar%4]+(i%3===1?4:7))/12),next,beat*.4,'square',.018,A.master,A.detune);
      next+=beat*b; i++;
    }},50)};
}
function musicStop(){ if(A.music){clearInterval(A.music.timer);A.music=null;} }
function noise(dur,{type='bandpass',freq=1000,q=1,vol=.3,at=0}={}){
  const C=A.ctx,s=C.createBufferSource(),f=C.createBiquadFilter(),g=C.createGain(),t=C.currentTime+at;
  s.buffer=A.noiseBuf;s.loop=true;f.type=type;f.frequency.value=freq;f.Q.value=q;
  s.connect(f);f.connect(g);g.connect(A.master);env(g,t,.02,vol,dur);s.start(t);s.stop(t+dur+.1);return {s,f,g};
}
const FX={
  applause(){const C=A.ctx,s=C.createBufferSource(),f=C.createBiquadFilter(),g=C.createGain();s.buffer=A.clapBuf;f.type='bandpass';f.frequency.value=2200;f.Q.value=.7;g.gain.value=.9;s.connect(f);f.connect(g);g.connect(A.master);s.start();},
  glitch(){const C=A.ctx,t=C.currentTime;for(let k=0;k<9;k++){tone(80+Math.random()*1600,t+k*.04,.03,'square',.05)}noise(.35,{type:'highpass',freq:3000,vol:.25});shake();},
  stinger(){const C=A.ctx,t=C.currentTime;[0,1,6,11,13].forEach(s=>tone(110*Math.pow(2,s/12),t,1.6,'sawtooth',.06));noise(.8,{type:'lowpass',freq:900,vol:.5});shake();},
  shh(){noise(.5,{freq:2600,q:2,vol:.18});noise(.5,{freq:2400,q:2,vol:.2,at:1.1});},
  rumble(){noise(2.4,{type:'lowpass',freq:160,vol:.9});noise(1.2,{type:'bandpass',freq:500,vol:.25,at:.3});},
  click(){tone(1200,A.ctx.currentTime,.02,'square',.03)},
  thud(){const C=A.ctx,o=C.createOscillator(),g=C.createGain();o.frequency.setValueAtTime(140,C.currentTime);o.frequency.exponentialRampToValueAtTime(40,C.currentTime+.2);o.connect(g);g.connect(A.master);env(g,C.currentTime,.005,.6,.25);o.start();o.stop(C.currentTime+.4)},
  door(){noise(.6,{type:'lowpass',freq:400,vol:.5});tone(70,A.ctx.currentTime,.4,'sine',.3)},
  buzz(){const t=A.ctx.currentTime;[0,.25].forEach(d=>tone(180,t+d,.15,'square',.04))},
  alarm(){const t=A.ctx.currentTime;for(let k=0;k<4;k++)tone(k%2?988:1319,t+k*.18,.12,'sine',.05)},
};
function humStart(){humStop();const C=A.ctx,o=C.createOscillator(),o2=C.createOscillator(),f=C.createBiquadFilter(),g=C.createGain();o.type='sawtooth';o.frequency.value=55;o2.type='sawtooth';o2.frequency.value=55.7;f.type='lowpass';f.frequency.value=180;g.gain.value=.0001;o.connect(f);o2.connect(f);f.connect(g);g.connect(A.master);o.start();o2.start();g.gain.exponentialRampToValueAtTime(.12,C.currentTime+1);A.hum={o,o2,g};}
function humStop(){if(A.hum){const C=A.ctx;A.hum.g.gain.exponentialRampToValueAtTime(.0001,C.currentTime+.3);const h=A.hum;setTimeout(()=>{h.o.stop();h.o2.stop()},400);A.hum=null;}}
function heartStart(bpm){heartStop();A.hb=setInterval(()=>{FX.thud();setTimeout(FX.thud,180)},60000/bpm);}
function heartStop(){if(A.hb){clearInterval(A.hb);A.hb=null;}}
function padStart(odd){padStop();const C=A.ctx,g=C.createGain();g.gain.value=.0001;g.connect(A.master);
  const os=[261.6,329.6,392,523.3].map(f=>{const o=C.createOscillator();o.type='sine';o.frequency.value=f;o.connect(g);o.start();return o;});
  g.gain.exponentialRampToValueAtTime(.06,C.currentTime+2);
  const iv=odd?setInterval(()=>tone(466.2,A.ctx.currentTime,2.2,'sine',.035,A.master,-38),4200):null;
  A.pad={g,os,iv};}
function padStop(){if(A.pad){const C=A.ctx;A.pad.g.gain.exponentialRampToValueAtTime(.0001,C.currentTime+.5);const p=A.pad;setTimeout(()=>p.os.forEach(o=>o.stop()),600);if(p.iv)clearInterval(p.iv);A.pad=null;}}
function allStop(){musicStop();humStop();heartStop();padStop();}
// no-op safely when audio could not start
for(const fn of ['musicStart','humStart','heartStart','padStart']){const orig=window[fn];window[fn]=(...a)=>{if(A.ctx)orig(...a)};}
for(const k of Object.keys(FX)){const orig=FX[k];FX[k]=(...a)=>{if(A.ctx)orig(...a)};}

/* ================= VISUALS (120x150 low-res) ================= */
const cv=document.getElementById('scene'),g=cv.getContext('2d'),W=120,H=150;
const nz=document.getElementById('noise'),nzg=nz.getContext('2d');
const stage=document.getElementById('stage'),darkEl=document.getElementById('dark');
const S={scene:'black',act:0,sync:false,fig:0,seoGone:false,zoom:1,glitchy:0,t0:performance.now()};
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function poly(pts,c){g.fillStyle=c;g.beginPath();g.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)g.lineTo(pts[i],pts[i+1]);g.closePath();g.fill();}
function audience(t,y,color,sync,seed){
  for(let row=0;row<3;row++){for(let x=-4+row*3;x<W+6;x+=9){
    const ph=sync?0:(x*1.7+row*5+seed);const bob=Math.round(Math.sin(t*3+ph)*(sync?1.2:0.6));
    const yy=y+row*9+bob; R(x,yy,7,12,color); R(x+1,yy-5,5,5,color);}}
}
const SCENES={
  black(){R(0,0,W,H,'#000')},
  tent(t){
    R(0,0,W,H,'#1a0707');
    const cx=60,top=-6;for(let i=0;i<14;i++){const a=i/14*W*2-W/2,b=(i+1)/14*W*2-W/2;poly([cx,top,a,92,b,92],i%2?'#7a1b1b':'#c9b48e');}
    R(0,0,W,H,'rgba(20,5,5,.35)');
    for(let i=0;i<16;i++){const x=i*8+2,y=20+Math.abs(Math.sin(i*.7))*14;const on=(Math.sin(t*2+i)>-.6);R(x,y,2,2,on?'#ffd27a':'#6b4a22');}
    // ring + spotlight
    poly([52,0,68,0,86,100,34,100],'rgba(255,240,200,.10)');
    g.fillStyle='#b08143';g.beginPath();g.ellipse(60,100,40,10,0,0,7);g.fill();g.fillStyle='#e7c27c';g.beginPath();g.ellipse(60,99,28,6,0,0,7);g.fill();
    if(S.act===1){R(58,84,4,10,'#2a2a6a');for(let k=0;k<5;k++){const a=t*4+k*1.256;R(60+Math.cos(a)*9,70-Math.abs(Math.sin(a))*14,2,2,['#ff5','#5ff','#f5f','#fff','#f85'][k]);}}
    if(S.act===2){g.strokeStyle='#ddd';g.beginPath();g.moveTo(40,0);g.lineTo(60+Math.sin(t*1.6)*16,40);g.lineTo(80,0);g.stroke();R(57+Math.sin(t*1.6)*16,40,6,8,'#e44');}
    audience(t,112,'#120808',S.sync,0);
    R(96,128,10,14,'#d33');R(96,128,10,3,'#fff');R(98,124,2,4,'#fff6c9');R(101,123,2,5,'#fff6c9');
  },
  collapse(t){
    R(0,0,W,H,'#000');
    g.strokeStyle='rgba(60,255,120,.55)';g.lineWidth=1;const hz=70;
    for(let i=-10;i<=10;i++){g.beginPath();g.moveTo(60+i*2,hz);g.lineTo(60+i*30,H);g.stroke();}
    for(let k=0;k<9;k++){const y=hz+Math.pow(k/8,2)*(H-hz)+((t*8)%6)*(k/8);g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
    for(let k=0;k<12;k++){const x=(k*37)%W,y=(70-((t*6+k*23)%110));const s=4+(k%3)*3;g.save();g.translate(x,y);g.rotate(t*.5+k);R(-s/2,-s/2,s,s*1.4,k%2?'#7a1b1b':'#c9b48e');g.restore();}
    audience(t,118,'#0a1a0e',true,0);
  },
  corridor(t){
    R(0,0,W,H,'#0b0909');
    const vx=60,vy=58;
    for(let i=0;i<10;i++){const c=i%2?'#5a1414':'#8c8170';const x0=i*6,x1=(i+1)*6;
      poly([x0,0,x1,0,vx-8+x1*.13,vy-10,vx-8+x0*.13,vy-10],c); }
    for(let i=0;i<10;i++){const c=i%2?'#8c8170':'#5a1414';const x0=W-i*6,x1=W-(i+1)*6;
      poly([x0,H,x1,H,vx+8-(W-x1)*.13,vy+10,vx+8-(W-x0)*.13,vy+10],'#1b1512');}
    poly([0,0,0,H,vx-8,vy+10,vx-8,vy-10],'#4b1414');poly([W,0,W,H,vx+8,vy+10,vx+8,vy-10],'#6e6556');
    for(let k=0;k<5;k++){poly([k*12,0,k*12+6,0,vx-8,vy-10+k*4,vx-8,vy-8+k*4],'rgba(0,0,0,.25)')}
    poly([0,H,W,H,vx+8,vy+10,vx-8,vy+10],'#1b1512');
    R(vx-8,vy-10,16,20,'#020202');
    // props: crate+buddha left, mirror+talisman right
    R(6,104,22,18,'#3b2a18');R(12,92,10,12,'#b8902e');R(14,86,6,7,S.glitchy?'#888':'#c9a23b');
    R(92,70,18,34,'#2c3b3f');R(94,72,14,30,'#4d6066');R(98,78,6,12,'#e8cf3a');R(99,80,4,1,'#a11');R(99,84,4,1,'#a11');
    // figure
    if(S.fig>0){const sc=[0,.45,.9,1.8][S.fig];const fh=26*sc,fw=6*sc,fx=vx-fw/2,fy=vy+10-fh;
      R(fx,fy+fh*.15,fw,fh*.85,'#000');R(fx-fw*.25,fy+fh*.05,fw*1.5,fh*.04,'#000');R(fx+fw*.15,fy-fh*.12,fw*.7,fh*.18,'#000');}
    // bulb flicker
    const on=Math.sin(t*23)>-.3||Math.sin(t*3.1)>.2;R(58,2,4,4,on?'#fff2b0':'#3a3320');if(on){g.fillStyle='rgba(255,240,180,.07)';g.fillRect(0,0,W,H);}
  },
  monitors(t){
    R(0,0,W,H,'#060807');
    for(let r=0;r<3;r++)for(let c=0;c<3;c++){const x=6+c*37,y=8+r*44,w=33,h=36;R(x-2,y-2,w+4,h+4,'#1b1f1d');
      const special=(r===1&&c===1);R(x,y,w,h,special?'#020403':'#16302a');
      if(!special){for(let k=0;k<3;k++)for(let j=0;j<6;j++){R(x+2+j*5,y+14+k*7,3,5,'#071510');R(x+2.5+j*5,y+12+k*7,2,2,'#071510');}}
      else{g.fillStyle='#7cff8a';g.font='7px monospace';g.fillText('312',x+9,y+14);g.fillText('/ 1',x+11,y+24);if(Math.sin(t*5)>0)R(x+2,y+30,4,2,'#7cff8a');}
      R(x,y+((t*30+r*7+c*11)%h),w,1,'rgba(150,255,190,.15)');}
  },
  exit(t){
    R(0,0,W,H,'#081210');poly([30,40,90,40,96,150,24,150],'#0c1a17');
    R(42,52,36,92,'#0f2622');
    const gap=4+Math.sin(t*1.5);g.fillStyle='rgba(255,230,160,.9)';g.fillRect(59-gap/2,54,gap,88);
    g.fillStyle='rgba(255,220,140,.12)';g.beginPath();g.moveTo(59,54);g.lineTo(20,150);g.lineTo(100,150);g.lineTo(61,54);g.fill();
    R(46,30,28,10,'#0a3b1b');g.fillStyle=Math.sin(t*9)>-.9?'#55ff7a':'#1a4a26';g.font='bold 8px monospace';g.fillText('EXIT',50,38);
  },
  swirl(t){

  if(L.w==='msg'){const [nm,body]=text.split('\n');who.textContent=nm+' · 메시지';txt.innerHTML='';const b=document.createElement('span');b.className='bubble';b.textContent=body;txt.appendChild(b);done(L);return;}

  clearInterval(typing);typing=setInterval(()=>{i++;txt.textContent=full.slice(0,i);if(i>=full.length){clearInterval(typing);typing=null;done(L);}},L.w==='sys'?70:34);
}
function done(L){
  if(L.wait){autoT=setTimeout(()=>{autoT=null;next();},val(L.wait));return;}
  if(li<lines.length-1){more.hidden=false;return;}
  finish();
}
function next(){
  if(typing){clearInterval(typing);typing=null;txt.textContent=full;done(lines[li]);return;}
  if(lines[li]&&lines[li].wait&&autoT)return; // suspense: can't skip waits
  if(li<lines.length-1){li++;show();}
}
function finish(){
  if(cur.next){more.hidden=false;cur._fin=true;return;}
  if(cur.end){endScreen(cur.end);return;}
  const list=val(cur.choices)||[];chs.innerHTML='';
  list.forEach(c=>{const b=document.createElement('button');b.textContent=c.l;b.onclick=()=>{if(A.ctx)FX.click();if(c.set)F[c.set]=1;go(c.to)};chs.appendChild(b);});
  if(cur.timer){const tm=cur.timer;timerEl.hidden=false;timerEl.style.transition='none';timerEl.style.transform='scaleX(1)';void timerEl.offsetWidth;timerEl.style.transition=`transform ${tm.ms}ms linear`;timerEl.style.transform='scaleX(0)';
    choiceT=setTimeout(()=>{if(tm.late)F.late=1;go(tm.to)},tm.ms);}
}
function advance(){
  if(cur&&cur._fin&&!typing&&li>=lines.length-1){cur._fin=false;go(cur.next);return;}
  next();
}
box.addEventListener('click',advance);
stage.addEventListener('click',e=>{if(!document.getElementById('title').hidden||document.getElementById('endS'))return;advance();});
box.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();advance();}});

/* ================= TITLE / END ================= */
document.getElementById('startBtn').onclick=()=>{
  try{audioInit();}catch(e){}
  document.getElementById('title').hidden=true;S.t0=performance.now();F={};A.detune=0;A.rate=1;go('n1');box.focus();
};
const MOMENTS=['반복되는 박수','천막이 벗겨질 때','불상·표·거울 흔적','서아가 사라졌다 나타날 때','불 꺼지고 슥슥 소리','단장이 가까워질 때','추격','모니터 속 "접속자 1"','서아의 얼굴','내 방 이음매·4,119회째','엔딩'];
function endScreen(label){
  const s=document.createElement('div');s.className='screen';s.id='endS';
  s.innerHTML=`<div class="ticket"><span>ENDING</span><b style="font-size:30px">${label}</b><span>${F.seenA&&F.seenB?'엔딩 2개 다 봄':'다른 엔딩이 하나 더 있어'}</span></div>`;
  stage.appendChild(s);
  chs.innerHTML='';const p=document.createElement('div');p.id='endpanel';
  p.innerHTML=`<div class="note" style="text-align:left">제일 소름 돋았던 순간을 골라 줘 (여러 개 가능). 가설이랑 비교할 거야.</div><div class="chips"></div><div id="copyout" hidden></div><div style="display:flex;gap:8px;flex-wrap:wrap"></div>`;
  const chips=p.querySelector('.chips'),out=p.querySelector('#copyout'),row=p.lastElementChild;const picked=new Set();
  MOMENTS.forEach(m=>{const c=document.createElement('button');c.className='chip';c.textContent=m;c.setAttribute('aria-pressed','false');c.onclick=()=>{picked.has(m)?picked.delete(m):picked.add(m);c.setAttribute('aria-pressed',picked.has(m));out.hidden=!picked.size;out.textContent=`v0 플레이 기록 · 엔딩 ${label}\n소름 돋은 순간: ${[...picked].join(', ')}`;};chips.appendChild(c);});
  const mk=(t,fn,cls='btn')=>{const b=document.createElement('button');b.className=cls;b.textContent=t;b.onclick=fn;row.appendChild(b);};
  mk('기록 복사',async()=>{try{await navigator.clipboard.writeText(out.textContent)}catch(e){const r=document.createRange();r.selectNodeContents(out);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);}});
  mk('다른 엔딩 보기',()=>{s.remove();allStop();go('room')});
  mk('처음부터',()=>{s.remove();allStop();F={};S.glitchy=0;S.fig=0;S.zoom=1;setDark(0);osd('');A.detune=0;A.rate=1;go('n1')});
  chs.appendChild(p);
}
requestAnimationFrame(draw);
</script>
