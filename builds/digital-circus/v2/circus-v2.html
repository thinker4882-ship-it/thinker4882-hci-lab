<title>디지털 서커스</title>
<style>
/* 레이아웃: 폰 세로 한 화면. 그림 층(미연시 캔버스) 위에 대화창이 뜬다. 단계마다 층(2D·3D)이 늘어난다. 밤의 초록 형광등 한 가지 룩. */
:root {
  --bg: #03110c;        /* 바깥 어둠 */
  --ink: #d9eadf;       /* 대사 글자 */
  --dim: #7fa392;       /* 보조 글자 */
  --box: rgba(6, 22, 17, 0.88); /* 대화창 바탕 */
  --line: #3f8a66;      /* 테두리, 형광등 초록 */
  --pick: #e8c86a;      /* 강조, 차창 밖 불빛 색 */
  --font: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden; }
#app { position: relative; height: 100%; max-width: 480px; margin: 0 auto; overflow: hidden; background: var(--bg); user-select: none; -webkit-user-select: none; touch-action: none; }
.layer { position: absolute; inset: 0; }
canvas.pix { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; object-fit: cover; }
/* 서아 그림: 대화창 뒤, 아래쪽 가운데. 화면 절반쯤 아래에만 두어 버스 뒷자리가 보이게 한다. */
.sprite { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 58%; max-width: 280px; image-rendering: pixelated; pointer-events: none; }
#flash { background: #f2f8ee; opacity: 0; pointer-events: none; transition: opacity 1.2s; }
#flash.on { opacity: 1; }

.screen { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; text-align: center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.screen h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: 0.08em; margin: 0; }
.screen p { color: var(--dim); margin: 0; line-height: 1.7; font-size: 0.95rem; }
button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); padding: 12px 22px; border-radius: 2px; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--pick); outline-offset: 2px; }

#box { position: absolute; left: 10px; right: 10px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); min-height: 118px; background: var(--box); border: 1px solid var(--line); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
#name { font-size: 0.8rem; color: var(--line); letter-spacing: 0.12em; min-height: 1em; }
#text { font-size: 1.05rem; line-height: 1.6; min-height: 1.6em; white-space: pre-wrap; }
#text.narr { color: var(--dim); }
#choices { display: flex; flex-direction: column; gap: 8px; }
#choices button { text-align: left; padding: 10px 14px; }
#hint { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px; text-align: center; font-size: 0.95rem; line-height: 1.6; color: var(--ink); background: var(--box); border: 1px solid var(--line); padding: 10px 12px; transition: opacity 1.5s; pointer-events: none; white-space: pre-line; }
/* 장소·물건 이름표: 그림만으로 알아보기 어려운 것에 작게 붙인다 */
#labels { pointer-events: none; }
/* 3D: 왼쪽 아래 가상 조이스틱 (누른 자리에 원이 뜬다) */
#gl { touch-action: none; }
#stick { position: absolute; width: 76px; height: 76px; border: 1px solid var(--line); border-radius: 50%; transform: translate(-50%, -50%); background: rgba(6, 22, 17, 0.35); pointer-events: none; }
#labels span { position: absolute; transform: translate(-50%, -100%); font-size: 0.68rem; color: var(--ink); background: rgba(3, 17, 12, 0.7); padding: 1px 5px; white-space: nowrap; letter-spacing: 0.04em; }
</style>

<div id="app">
  <div id="start" class="layer screen">
    <h1>디지털 서커스</h1>
    <p>이어폰을 끼고 해 줘.<br>화면을 누르면 다음으로 넘어가.</p>
    <button id="startBtn">처음부터</button>
    <button id="stage2Btn">2단계(상가)부터</button>
    <button id="stage3Btn">3단계(서커스)부터</button>
  </div>
  <div id="vn" class="layer" hidden><canvas id="vnCanvas" class="pix" width="135" height="240"></canvas></div>
  <img id="seoa" class="sprite" alt="서아" hidden>
  <div id="world" class="layer" hidden><canvas id="gl" class="pix"></canvas><div id="stick" hidden></div></div>
  <div id="labels" class="layer"></div>
  <div id="hint" hidden></div>
  <div id="box" hidden><div id="name"></div><div id="text"></div><div id="choices"></div></div>
  <div id="flash" class="layer"></div>
  <div id="end" class="layer screen" hidden>
    <h1>3단계 끝</h1>
    <p>여기까지가 계단 0~4야.<br>어느 순간이 제일 이상했는지 기억해 둬.</p>
    <button id="againBtn">처음부터</button>
  </div>
</div>

<!-- three.js: 계단 4 서커스 3D 장면을 그리려고 씀. r128은 전역 THREE를 주는 UMD 빌드 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

/* ===================== 기억 (장치 6: 다시 열면 기억함) ===================== */
/** 이 브라우저에만 남는 기록 (막히면 처음 온 사람으로 취급). */
const store = {
  get(k, d) { try { const v = localStorage.getItem("dcv2-" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("dcv2-" + k, JSON.stringify(v)); } catch (e) {} },
};
const visits = store.get("main-visits", 0);

/* ===================== 소리 (장치 7, WebAudio 합성) ===================== */
let ac = null, master = null, noiseBuf = null;
/** 사용자가 누른 뒤에만 오디오를 연다 (브라우저 정책). */
function initAudio() {
  if (ac) return; // 한 번만 연다
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
}
/** 짧게 잦아드는 잡음 버퍼 (발소리·문소리·빗소리 재료). */
function noise() {
  if (!noiseBuf) {
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}
/** 버스 엔진 웅웅거림. 멈추는 함수를 돌려준다. */
function startEngine() {
  const g = ac.createGain(); g.gain.value = 0.13;
  const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 150;
  const o1 = ac.createOscillator(), o2 = ac.createOscillator(), lfo = ac.createOscillator(), lg = ac.createGain();
  o1.type = o2.type = "sawtooth"; o1.frequency.value = 47; o2.frequency.value = 47.7;
  lfo.frequency.value = 0.35; lg.gain.value = 0.04; lfo.connect(lg); lg.connect(g.gain);
  o1.connect(f); o2.connect(f); f.connect(g); g.connect(master);
  [o1, o2, lfo].forEach((o) => o.start());
  return () => { [o1, o2, lfo].forEach((o) => { try { o.stop(); } catch (e) {} }); g.disconnect(); };
}
/** 빗소리. 세기를 바꿀 수 있는 gain을 돌려준다. */
function startRain(vol) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noise(); s.loop = true; f.type = "bandpass"; f.frequency.value = 2400; f.Q.value = 0.6; g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(master); s.start(); return g;
}
/** 램프 지잉 소리. 높이를 바꿀 수 있게 oscillator를 돌려준다. */
function startHum() {
  const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
  o.type = "square"; o.frequency.value = 100; f.type = "bandpass"; f.frequency.value = 800; f.Q.value = 3; g.gain.value = 0.018;
  o.connect(f); f.connect(g); g.connect(master); o.start(); return o;
}
/** 돌아가는 세탁기: 낮은 웅웅거림에 통이 구르는 박자. 멈추는 함수를 돌려준다. */
function startWasher() {
  const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
  o.type = "triangle"; o.frequency.value = 62; f.type = "lowpass"; f.frequency.value = 220; g.gain.value = 0.07;
  lfo.frequency.value = 0.9; lg.gain.value = 0.05; lfo.connect(lg); lg.connect(g.gain);
  o.connect(f); f.connect(g); g.connect(master); o.start(); lfo.start();
  return () => { try { o.stop(); lfo.stop(); } catch (e) {} g.disconnect(); };
}
/** 글자 소리. */
function blip(pitch, vol) {
  if (!ac || !pitch) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = "square"; o.frequency.value = pitch;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.05);
}
/** 짧은 잡음 한 번 (문 열림 쉬익, 딸깍 등). */
function burst(freq, dur, vol) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime;
  s.buffer = noise(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 1;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.05);
}
/** 벽시계 초침. 가끔 한 박을 건너뛰거나 두 번 친다. 멈추는 함수를 돌려준다. */
function startClock() {
  let alive = true, n = 0;
  const tick = () => {
    if (!alive) return;
    n++;
    const skip = n > 6 && Math.random() < 0.12, dbl = n > 6 && Math.random() < 0.08;
    if (!skip) burst(4200, 0.02, 0.05);
    if (dbl) setTimeout(() => burst(4200, 0.02, 0.05), 140);
    setTimeout(tick, 1000);
  };
  tick(); return () => { alive = false; };
}
/** 문 너머 오르골 왈츠. 시간이 갈수록 음이 틀어진다. 멈추는 함수와 '잠깐 멈춤' 함수를 돌려준다. */
function startMusicBox() {
  const melody = [76, 79, 84, 83, 79, 76, 74, 77, 81, 79, 76, 72]; // 미디 번호, 3/4박
  const out = ac.createGain(), f = ac.createBiquadFilter();
  out.gain.value = 0.0; f.type = "lowpass"; f.frequency.value = 1800; // 문 너머라 먹먹하게
  out.connect(f); f.connect(master);
  out.gain.linearRampToValueAtTime(0.06, ac.currentTime + 6);
  let alive = true, i = 0, drift = 0, paused = false;
  const play = () => {
    if (!alive) return;
    if (!paused) {
      const t = ac.currentTime, m = melody[i % melody.length] + drift * (Math.random() - 0.3);
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "triangle"; o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
      g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + 1);
      i++; drift = Math.min(1.6, drift + 0.02);
    }
    setTimeout(play, i % 3 === 0 ? 520 : 400 + drift * 60);
  };
  play();
  return { stop() { alive = false; out.gain.value = 0; }, pause(ms) { paused = true; setTimeout(() => (paused = false), ms); } };
}

/* ===================== 그림 (미연시 캔버스, 장치 3: 그림의 오류) ===================== */
const vc = $("vnCanvas"), vx = vc.getContext("2d");
const vn = {
  scene: "bus", big: true, face: "calm", glitch: 0,
  passenger: true, flowing: true, lightsOn: true,                     // 버스 상태
  washer: "spin", busOutside: true, paintingFigure: visits > 0, doorOpen: false, // 빨래방 상태
};
/** 고정 시드 난수 (불빛 자리가 매번 같게). */
function seeded(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const cityDots = (() => { const r = seeded(7); return Array.from({ length: 40 }, () => [r(), r()]); })();
/** 다각형 채우기. */
function poly(pts, c) { vx.fillStyle = c; vx.beginPath(); vx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) vx.lineTo(pts[i], pts[i + 1]); vx.fill(); }

/** 계단 0~1: 원근이 있는 버스 안 (참조 1번). */
function drawBus(t) {
  vx.fillStyle = "#06140f"; vx.fillRect(0, 0, 135, 240);
  poly([0, 0, 135, 0, 86, 80, 49, 80], "#0c2a22");
  poly([0, 240, 135, 240, 86, 136, 49, 136], "#1d5a3c");
  poly([0, 0, 49, 80, 49, 136, 0, 240], "#0f3a2c");
  poly([135, 0, 86, 80, 86, 136, 135, 240], "#12402f");
  vx.fillStyle = "#2f7a52"; vx.fillRect(49, 80, 37, 56);
  poly([135, 26, 86, 86, 86, 106, 135, 150], "#082219");
  vx.fillStyle = "#e8c86a";
  if (vn.flowing) vn.flow = (t / 4000) % 1;
  cityDots.forEach(([u, v]) => {
    const d = (u + (vn.flow || 0)) % 1, x = 135 - d * 49, top = 26 + d * 60, bot = 150 - d * 44;
    vx.fillRect(Math.round(x), Math.round(top + v * (bot - top) * 0.5), 1, 1);
  });
  if (vn.lightsOn) poly([58, 4, 77, 4, 71, 76, 64, 76], "#cdeed6");
  for (let k = 4; k >= 0; k--) {
    const s = 1 - (k / 5) * 0.78, y = 104 + s * 34, h = s * 40, w = s * 26;
    vx.fillStyle = "#1c3355"; vx.fillRect(Math.round(67 - s * 62), Math.round(y), Math.round(w), Math.round(h));
    vx.fillRect(Math.round(67 + s * 36), Math.round(y), Math.round(w), Math.round(h));
    vx.fillStyle = "#3a6fc0"; vx.fillRect(Math.round(67 - s * 62), Math.round(y), Math.round(w), Math.max(1, Math.round(2 * s)));
    vx.fillRect(Math.round(67 + s * 36), Math.round(y), Math.round(w), Math.max(1, Math.round(2 * s)));
  }
  if (vn.passenger) { // 맨 뒤 흰 셔츠 승객. 다시 온 사람에겐 처음부터 고개를 들고 있다.
    const up = visits > 0;
    vx.fillStyle = "#d8dccf"; vx.fillRect(74, 116, 7, 9);
    vx.fillStyle = "#0b0b0b"; vx.fillRect(up ? 75 : 76, up ? 110 : 112, 5, 5);
    if (up) { vx.fillStyle = "#cfc7b8"; vx.fillRect(76, 112, 3, 3); }
  }
  if (!vn.lightsOn) { vx.fillStyle = "rgba(0,0,0,0.45)"; vx.fillRect(0, 0, 135, 240); }
}

/** 계단 1: 정류장 옆 24시 무인 빨래방. 상태에 따라 창밖·포스터·세탁기·문이 바뀐다. */
function drawRoom(t) {
  vx.fillStyle = "#16352b"; vx.fillRect(0, 0, 135, 44);                 // 천장
  vx.fillStyle = "#d8f2dc"; vx.fillRect(14, 14, 46, 3); vx.fillRect(76, 14, 46, 3); // 형광등 두 줄
  vx.fillStyle = "#5f8f7a"; vx.fillRect(0, 44, 135, 120);                // 벽
  for (let y = 164; y < 240; y += 8) for (let x = 0; x < 135; x += 8) {   // 타일 바닥
    vx.fillStyle = ((x + y) / 8) % 2 ? "#3f6b5c" : "#4a7a6a"; vx.fillRect(x, y, 8, 8);
  }
  // 앞쪽 유리창: 빗줄기, 창밖 정류장의 버스
  vx.fillStyle = "#06140f"; vx.fillRect(4, 56, 40, 94);
  if (vn.busOutside) { vx.fillStyle = "#1d3a30"; vx.fillRect(8, 108, 34, 14); vx.fillStyle = "#cfe8c0"; for (let x = 10; x < 40; x += 6) vx.fillRect(x, 110, 4, 5); }
  vx.fillStyle = "rgba(160,200,180,0.35)"; for (let i = 0; i < 14; i++) { const x = 5 + ((i * 7 + t / 30) % 38), y = 57 + ((i * 13 + t / 9) % 90); vx.fillRect(Math.floor(x), Math.floor(y), 1, 3); }
  vx.fillStyle = "#2c4a40"; vx.fillRect(4, 56, 40, 2); vx.fillRect(4, 148, 40, 2); vx.fillRect(23, 56, 2, 94);
  // 건조기 두 대 (위), 세탁기 두 대 (아래). 오른쪽 아래 세탁기만 돈다.
  for (const x of [50, 74]) {
    vx.fillStyle = "#d8e2dc"; vx.fillRect(x, 60, 22, 34); vx.fillStyle = "#20302a"; vx.beginPath(); vx.arc(x + 11, 79, 7, 0, Math.PI * 2); vx.fill();
    vx.fillStyle = "#d8e2dc"; vx.fillRect(x, 102, 22, 48); vx.fillStyle = "#9fb0a8"; vx.fillRect(x + 2, 104, 18, 4);
    vx.fillStyle = "#20302a"; vx.beginPath(); vx.arc(x + 11, 128, 8, 0, Math.PI * 2); vx.fill();
  }
  if (vn.washer === "spin") { const a = t / 180; vx.fillStyle = "#7f9fb8"; vx.fillRect(85 + Math.round(Math.cos(a) * 4) - 2, 128 + Math.round(Math.sin(a) * 4) - 2, 5, 4); }
  else if (vn.washer === "shirt") { vx.fillStyle = "#e6eadf"; vx.fillRect(81, 127, 8, 5); }
  vx.fillStyle = vn.washer === "spin" ? "#7fe0a0" : "#304a40"; vx.fillRect(91, 105, 2, 2); // 작동 불빛
  // 포스터: 섬유유연제 광고의 초록 언덕. 다시 보면 언덕 위에 작은 사람.
  vx.fillStyle = "#e8e2cc"; vx.fillRect(102, 60, 26, 32);
  const gr = vx.createLinearGradient(0, 62, 0, 86); gr.addColorStop(0, "#9fd8b8"); gr.addColorStop(1, "#1f8a5a");
  vx.fillStyle = gr; vx.fillRect(104, 62, 22, 24);
  vx.fillStyle = "#176a44"; vx.beginPath(); vx.ellipse(115, 88, 14, 8, 0, Math.PI, 0); vx.fill();
  vx.fillStyle = "#e8e2cc"; vx.fillRect(104, 86, 22, 4); vx.fillStyle = "#7a8a80"; vx.fillRect(107, 87, 16, 1);
  if (vn.paintingFigure) { vx.fillStyle = "#f4f4ec"; vx.fillRect(115, 77, 1, 2); }
  // 직원 전용 문
  vx.fillStyle = "#3a4a44"; vx.fillRect(102, 98, 26, 66);
  if (vn.doorOpen) { vx.fillStyle = "#eef6e8"; vx.fillRect(104, 100, 22, 64); vx.fillStyle = "#8a9a92"; vx.fillRect(104, 100, 5, 64); }
  else { vx.fillStyle = "#8a9a92"; vx.fillRect(104, 100, 22, 64); vx.fillStyle = "#e8e2cc"; vx.fillRect(108, 108, 14, 5); vx.fillStyle = "#d0c090"; vx.fillRect(122, 132, 2, 2); }
  // 주황 벤치와 작은 서아 (큰 그림이 없을 때만)
  vx.fillStyle = "#c8742a"; vx.fillRect(14, 172, 80, 7); vx.fillStyle = "#8a4e1c"; vx.fillRect(18, 179, 3, 10); vx.fillRect(87, 179, 3, 10);
  if (!vn.big) {
    vx.fillStyle = "#16110f"; vx.beginPath(); vx.arc(64, 156, 6, 0, Math.PI * 2); vx.fill();
    vx.fillStyle = "#e6d6c3"; vx.beginPath(); vx.ellipse(64, 158, 3.5, 4.5, 0, 0, Math.PI * 2); vx.fill();
    vx.fillStyle = "#4f5f7f"; vx.fillRect(58, 163, 12, 10);
    vx.fillStyle = "#cfe8f0"; vx.fillRect(68, 166, 2, 3); // 폰 불빛
  }
}

/** 서아 (힉스필드 그림). 표정에 맞는 그림을 띄우고, 화면이 밀릴 땐 같이 흔들린다. */
const seoaImg = $("seoa");
function showSeoa(on) {
  seoaImg.hidden = !on; if (!on) return;
  const want = "img/seoa-" + (["worry", "smile", "wrong"].includes(vn.face) ? vn.face : "calm") + ".png";
  if (seoaImg.dataset.face !== want) { seoaImg.src = want; seoaImg.dataset.face = want; }
  seoaImg.style.transform = vn.glitch && Math.random() < 0.15 * vn.glitch ? `translateX(calc(-50% + ${(Math.random() - 0.5) * 8 * vn.glitch}px))` : "translateX(-50%)";
}

/** 한 프레임: 장면 → 서아 → 줄 밀림 → 초록 기운. */
function frame(t) {
  if (vn.scene === "bus") drawBus(t); else if (vn.scene === "room") drawRoom(t); else if (is2D()) draw2D(t); else { vx.fillStyle = "#000"; vx.fillRect(0, 0, 135, 240); }
  showSeoa((!$("vn").hidden && vn.scene !== "black" || !$("world").hidden) && vn.big);
  placeLabels(labelsFor());
  for (let i = 0; i < vn.glitch * 3; i++) if (Math.random() < 0.3) {
    const y = Math.floor(Math.random() * 240), h = 2 + Math.floor(Math.random() * 6);
    vx.drawImage(vc, 0, y, 135, h, (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 5), y, 135, h);
  }
  vx.fillStyle = "rgba(30,160,100,0.10)"; vx.fillRect(0, 0, 135, 240);
  requestAnimationFrame(frame);
}
/** 화면 좌표 → 캔버스 좌표 (object-fit: cover로 잘린 만큼 보정). */
function toCanvas(e) {
  const r = vc.getBoundingClientRect(), s = Math.max(r.width / 135, r.height / 240);
  return { x: (e.clientX - r.left - (r.width - 135 * s) / 2) / s, y: (e.clientY - r.top - (r.height - 240 * s) / 2) / s };
}

/* ===================== 대화창 (미연시 형식) ===================== */
const box = $("box"), nameEl = $("name"), textEl = $("text"), choicesEl = $("choices");
const talk = { typing: false, full: "", timer: null, resolve: null, waitTap: false };
const VOICE = { "서아": 620, "안내 방송": 300, "": 0 };
/** 한 줄을 타자 치듯 띄우고, 다 읽고 누르면 끝나는 약속을 돌려준다. who가 ""이면 행동 묘사. */
function say(who, text, opts = {}) {
  return new Promise((resolve) => {
    box.hidden = false; nameEl.textContent = who; textEl.textContent = ""; choicesEl.innerHTML = "";
    textEl.classList.toggle("narr", who === "");
    vn.big = who === "서아" ? true : (vn.scene === "bus");
    talk.full = text; talk.typing = true; talk.waitTap = false; talk.resolve = resolve;
    const pitch = opts.pitch !== undefined ? opts.pitch : VOICE[who];
    let i = 0; clearInterval(talk.timer);
    talk.timer = setInterval(() => {
      i++; textEl.textContent = text.slice(0, i);
      if (i % 2 === 1 && text[i - 1] && text[i - 1] !== " ") blip(pitch, 0.025);
      if (i >= text.length) {
        clearInterval(talk.timer); talk.typing = false;
        if (opts.auto) setTimeout(() => { talk.resolve = null; resolve(); }, opts.auto); else talk.waitTap = true;
      }
    }, opts.speed || 48);
  });
}
/** 선택지를 띄우고 고른 번호를 돌려준다 (진짜 선택). */
function choose(labels) {
  return new Promise((resolve) => {
    box.hidden = false; nameEl.textContent = ""; textEl.textContent = ""; choicesEl.innerHTML = ""; talk.waitTap = false;
    labels.forEach((l, i) => {
      const b = document.createElement("button"); b.id = "choice" + i; b.textContent = l;
      b.addEventListener("click", () => { blip(880, 0.03); choicesEl.innerHTML = ""; resolve(i); });
      choicesEl.appendChild(b);
    });
  });
}
/** 화면을 누르면: 치는 중이면 다 보여 주고, 다 보였으면 다음으로. */
function onTap() {
  if (talk.typing) { clearInterval(talk.timer); textEl.textContent = talk.full; talk.typing = false; talk.waitTap = true; return; }
  if (talk.waitTap) { talk.waitTap = false; const r = talk.resolve; talk.resolve = null; if (r) r(); }
}
box.addEventListener("pointerup", (e) => { if (e.target.tagName !== "BUTTON") onTap(); });

/* ===================== 누르는 탐색 (계단 1 휴게실) ===================== */
const SPOTS = { window: [4, 56, 40, 94], washer: [50, 60, 46, 90], poster: [102, 60, 26, 32], door: [102, 98, 26, 66], seoa: [54, 148, 22, 28] };
let spotResolve = null;
/** 대화창을 숨기고, 플레이어가 누른 물건 이름을 돌려준다. */
function pickSpot() {
  box.hidden = true; vn.big = false;
  return new Promise((r) => (spotResolve = r));
}
$("vn").addEventListener("pointerup", (e) => {
  if (is2D()) { if (W2.busy) onTap(); else release2D(); return; }
  if (!spotResolve) { onTap(); return; }
  const p = toCanvas(e);
  for (const [id, [x, y, w, h]] of Object.entries(SPOTS)) {
    if (p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h) { const r = spotResolve; spotResolve = null; blip(500, 0.02); r(id); return; }
  }
});
/** 위쪽 안내 문구를 잠깐 띄운다. */

/** 24시 무인 빨래방. 누르며 둘러보는 동안 소리가 하나씩 어긋난다. */
async function stair1Room() {
  vn.scene = "room"; vn.washer = "spin";
  const hum = startHum(), stopClock = startClock(), washer = startWasher();
  await say(S, "다행이다, 여기는 열려 있네.");
  await say(S, "택시 부를게. 잠깐만.");
  hint("둘러볼 곳을 눌러 봐");
  const seen = {}; let music = null, unlocked = false, after = 0, seoaTalk = 0;
  for (;;) {
    const id = await pickSpot();
    const n = (seen[id] = (seen[id] || 0) + 1);
    if (id === "washer") {
      if (music) { vn.washer = "shirt"; await say("", "(세탁기가 멈춰 있다. 안에 흰 셔츠가 한 장 들어 있다.)"); }
      else if (n === 1) await say("", "(세탁기 하나가 혼자 돌아가고 있다. 주인은 없다.)");
      else { [0, 300, 600].forEach((ms) => setTimeout(() => blip(1320, 0.04), ms)); await say("", "(다 됐다는 알림이 울린다. 아무도 오지 않는다.)"); }
    } else if (id === "window") {
      if (n === 1) await say("", "(창밖 정류장에 버스가 그대로 서 있다. 불이 켜져 있다.)");
      else { vn.busOutside = false; await say("", "(버스가 없다.)"); }
    } else if (id === "poster") {
      if (n === 1 && !vn.paintingFigure) await say("", "(섬유유연제 광고. 초록 언덕.)");
      else { vn.paintingFigure = true; await say("", "(언덕 위에 사람이 하나 서 있다.)"); }
    } else if (id === "door") {
      if (!unlocked) await say("", music ? "(잠겨 있다. 음악은 이 너머에서 난다.)" : n === 1 ? "(직원 전용. 잠겨 있다.)" : "(손잡이가 차갑다.)");
      else break;
    } else if (id === "seoa") {
      seoaTalk++;
      if (seoaTalk === 1) { vn.face = "worry"; await say(S, "택시가 안 잡혀. 배터리도 3퍼센트야."); }
      else if (seoaTalk === 2) { vn.face = "smile"; await say(S, "그래도 너랑 있어서 다행이다. 혼자였으면 울었어."); }
      else { vn.face = "calm"; await say(S, music ? "저 문, 열어 보고 싶지?" : "조금만 있다가 가자."); }
    }
    const distinct = Object.keys(seen).length;
    if (!music && distinct >= 3) {
      washer(); vn.washer = "stop"; // 세탁기가 뚝 멈추고, 그 빈자리에 음악이 들어온다
      await wait(1800);
      music = startMusicBox();
      await wait(2500);
      vn.face = "calm"; await say(S, "음악 소리 들려?");
      const m = await choose(["들려.", "안 들리는데."]);
      if (m === 0) { vn.face = "worry"; await say(S, "어디서 나는 거지."); }
      else { music.pause(1800); vn.face = "calm"; await say(S, "……그래? 나만 들리나."); }
    } else if (music && !unlocked && (++after >= 2 && (seen.window >= 2 || seen.poster >= 2 || seen.washer >= 2) || after >= 4)) { // 바뀐 것을 하나는 보고 나서 열린다
      // 들어온 유리문이 잠겨서, 저절로 열린 직원 전용 문만 남는다
      unlocked = true; [0, 180].forEach((ms) => setTimeout(() => blip(990, 0.04), ms));
      await say("", "(유리문 쪽에서 삑 소리. 문 위 화면에 '출입 인증 후 이용하세요'가 떠 있다.)");
      vn.face = "worry"; await say(S, "들어올 땐 그냥 열렸는데.");
      await say("", "(서아가 유리문을 밀어 본다. 꿈쩍도 안 한다.)");

      await say("", "(직원 전용 문에서 딸깍 소리가 난다.)");
      vn.face = "calm"; await say(S, "문 열렸다.", { pitch: 520 }); // 이 한 줄만 목소리가 낮다
      vn.doorOpen = true;
      vn.face = "worry"; await say(S, "저쪽으로 나가 보자. 뒤로 나가는 길이 있겠지.");
    }
  }
  stopClock(); hum.stop(); music && music.stop();
  $("flash").classList.add("on"); await wait(1600);
}

/* ===================== 2D 엔진 (계단 2·3: 위에서 내려다보며 걷기) ===================== */
const T = 8, OY = 30;                       // 타일 크기, 맵을 캔버스에 놓는 세로 위치
const SOLID = "#scpbImGXPveq";              // 못 지나가는 타일
const W2 = { map: [], px: 0, py: 0, hold: null, down: null, auto: null, busy: true, trail: [], sx: 0, sy: 0, seoaAway: false,
  npcs: [], things: [], dark: false, flick: false, moved: false, face: "up", stepAcc: 0, stuck: 0, tick: null, catchFig: null };
const is2D = () => vn.scene === "mall" || vn.scene === "corridor";
/** 그 자리의 타일 글자. 맵 밖은 벽. */
function tileAt(x, y) { const r = W2.map[Math.floor(y / T)]; return (r && r[Math.floor(x / T)]) || "#"; }
/** 발밑 네 귀퉁이가 모두 비어 있는지. */
function free(x, y) { return [[-2, 0], [2, 0], [-2, -2], [2, -2]].every(([a, b]) => !SOLID.includes(tileAt(x + a, y + b))); }

/** 한 프레임 이동: 누르고 있으면 손가락 쪽으로, 살펴볼 것을 짧게 눌렀으면 그쪽으로 걸어가 닿으면 살펴본다. */
function move2D(dt) {
  W2.moved = false;
  if (W2.busy) return;
  if (W2.auto && !W2.hold) {
    const da = Math.hypot(W2.auto.x - W2.px, W2.auto.y - W2.py);
    if (da < (W2.auto.reach || 13) || (W2.stuck > 0.6 && da < 26)) { const a = W2.auto; W2.auto = null; W2.path = []; W2.stuck = 0; act(a); return; }
  }
  while (!W2.hold && W2.path && W2.path.length && Math.hypot(W2.path[0][0] - W2.px, W2.path[0][1] - W2.py) < 1.5) W2.path.shift();
  const tgt = W2.hold || (W2.auto && W2.path && W2.path.length ? { x: W2.path[0][0], y: W2.path[0][1] } : W2.auto);
  if (!tgt) return;
  const dx = tgt.x - W2.px, dy = tgt.y - W2.py, d = Math.hypot(dx, dy);
  if (d < 1.5) return;
  const s = Math.min(30 * dt, d), ox = W2.px, oy = W2.py;
  if (free(W2.px + dx / d * s, W2.py)) W2.px += dx / d * s;
  if (free(W2.px, W2.py + dy / d * s)) W2.py += dy / d * s;
  const went = Math.hypot(W2.px - ox, W2.py - oy);
  W2.stuck = went < 0.05 ? W2.stuck + dt : 0;
  if (W2.stuck > 1.5) { W2.auto = null; W2.stuck = 0; }
  if (went < 0.05) return;
  W2.moved = true; W2.face = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
  W2.trail.push([W2.px, W2.py]); if (W2.trail.length > 60) W2.trail.shift();
  W2.stepAcc += dt; if (W2.stepAcc > 0.32) { W2.stepAcc = 0; burst(500, 0.05, 0.05); }
  if (!W2.seoaAway && W2.trail.length > 14) { const p = W2.trail[W2.trail.length - 14]; W2.sx = p[0]; W2.sy = p[1]; }
}
/** 살펴보기 실행. 그동안 입력을 막고, 끝나면 대화창을 닫는다. */
async function act(o) {
  W2.busy = true; W2.hold = null;
  try { await o.act(o); } finally { box.hidden = true; vn.big = false; W2.busy = false; }
}
/** 화면 좌표 → 2D 맵 좌표. */
function to2D(e) { const p = toCanvas(e); return { x: p.x, y: p.y - OY }; }
const vnEl = $("vn");
vnEl.addEventListener("pointerdown", (e) => {
  if (!is2D() || W2.busy) return;
  const p = to2D(e); W2.down = { t: performance.now(), p }; W2.hold = p; W2.auto = null;
});
vnEl.addEventListener("pointermove", (e) => { if (is2D() && W2.hold) W2.hold = to2D(e); });
/** 손을 떼면 멈춘다. 짧게 눌렀고 그 자리에 살펴볼 것이 있으면 그쪽으로 걸어간다. */
function release2D() {
  const short = W2.down && performance.now() - W2.down.t < 260, p = W2.down && W2.down.p;
  W2.hold = null; W2.down = null;
  if (!short) return;
  const all = W2.things.concat(W2.npcs, [W2.seoa]).filter((o) => o && o.act && !o.gone);
  let best = null, bd = 1e9;
  all.forEach((o) => { const d = Math.hypot(o.x - p.x, o.y - p.y); if (d < (o.r || 9) && d < bd) { best = o; bd = d; } });
  if (best) { W2.auto = best; W2.path = findPath(best.x, best.y); }
}
/** 타일 칸 단위 너비 우선 탐색: 살펴볼 것 바로 옆 빈칸까지 가는 길 (타일 가운데 점들). */
function findPath(tx, ty) {
  const ok = (c, r) => { const ch = (W2.map[r] || "")[c]; return ch !== undefined && !SOLID.includes(ch); };
  const k = (c, r) => r * 64 + c, c0 = Math.floor(W2.px / T), r0 = Math.floor((W2.py - 1) / T), ct = Math.floor(tx / T), rt = Math.floor(ty / T);
  const prev = new Map([[k(c0, r0), null]]), q = [[c0, r0]];
  let end = null;
  while (q.length) {
    const [c, r] = q.shift();
    if (Math.abs(c - ct) + Math.abs(r - rt) <= 1) { end = [c, r]; break; }
    for (const [a, b] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const n = [c + a, r + b]; if (ok(n[0], n[1]) && !prev.has(k(n[0], n[1]))) { prev.set(k(n[0], n[1]), [c, r]); q.push(n); } }
  }
  const out = []; for (let cur = end; cur; cur = prev.get(k(cur[0], cur[1]))) out.unshift([cur[0] * T + 4, cur[1] * T + 6]);
  return out.slice(1);
}

/* ---------- 그리기 ---------- */
const FLOOR_LIGHT = (() => { const r = seeded(21); return Array.from({ length: 40 }, () => r() < 0.22); })();
/** 타일 한 칸. */
function drawTile(ch, c, r, t) {

let circusHooks = null;
/** 3D 한 프레임: 이동 → 서아·관객·단장 → 비상구 도착 확인 → 렌더. */
function frame3(now) {
  if (W3.ended) return;
  const dt = Math.min(0.05, (now - (W3.last || now)) / 1000); W3.last = now;
  const k = W3.keys;
  if (W3.auto) { // 저절로 끌려가는 중
    const a = W3.auto, p = Math.min(1, (now - a.t0) / a.ms);
    W3.x = a.from.x + (a.to.x - a.from.x) * p; W3.z = a.from.z + (a.to.z - a.from.z) * p; a.y = 1.55 + (a.to.y - 1.55) * p;
    W3.yaw += (a.yaw - W3.yaw) * 0.05; W3.pitch *= 0.95;
    if (p >= 1 && a.done) { const d = a.done; a.done = null; d(); }
  } else if (box.hidden && !W3.cut) {
    let fwd = (k.w || k.arrowup ? 1 : 0) - (k.s || k.arrowdown ? 1 : 0), side = (k.d ? 1 : 0) - (k.a ? 1 : 0);
    if (k.arrowleft) W3.yaw += 1.8 * dt; if (k.arrowright) W3.yaw -= 1.8 * dt;
    if (W3.joy) { fwd = -W3.joy.dy; side = W3.joy.dx; }
    if (fwd || side) {
      const sp = 1.6 * dt, nx = W3.x + (-Math.sin(W3.yaw) * fwd + Math.cos(W3.yaw) * side) * sp, nz = W3.z + (-Math.cos(W3.yaw) * fwd - Math.sin(W3.yaw) * side) * sp;
      const d = Math.hypot(nx, nz), s = d > R_FLOOR ? R_FLOOR / d : 1;
      W3.x = nx * s; W3.z = nz * s;
      W3.stepAcc = (W3.stepAcc || 0) + dt; if (W3.stepAcc > 0.45) { W3.stepAcc = 0; burst(500, 0.05, 0.06); }
    }
  }
  // 연출 중엔 시선을 대상 쪽으로 천천히 돌린다
  if (W3.lookTarget) { const p = W3.lookTarget.position; let d = Math.atan2(-(p.x - W3.x), -(p.z - W3.z)) - W3.yaw; d = Math.atan2(Math.sin(d), Math.cos(d)); W3.yaw += d * 0.06; W3.pitch *= 0.9; }
  // 객석으로 올라가려 하면(비상구가 아닌 가장자리를 계속 밀면) 한 번, 서아가 말린다
  const e0 = EXITS[W3.exitIdx];
  if (W3.dan.active && !W3.grabbed && box.hidden && Math.hypot(W3.x, W3.z) > R_FLOOR - 0.3 && Math.hypot(W3.x - Math.cos(e0) * R_FLOOR, W3.z - Math.sin(e0) * R_FLOOR) > 2.5) {
    W3.edgeT = (W3.edgeT || 0) + dt; if (W3.edgeT > 0.6) { W3.grabbed = true; circusHooks.grab(); }
  } else W3.edgeT = 0;
  camera.position.set(W3.x, W3.auto ? W3.auto.y : 1.55, W3.z); camera.rotation.y = W3.yaw; camera.rotation.x = W3.pitch;
  setListener(W3.x, 1.55, W3.z, W3.yaw);
  // 서아 그림이 왼쪽 뒤에서 따라온다
  if (!W3.seoaFixed) { const tx = W3.x + Math.sin(W3.yaw) * 0.9 - Math.cos(W3.yaw) * 0.7, tz = W3.z + Math.cos(W3.yaw) * 0.9 + Math.sin(W3.yaw) * 0.7; W3.seoa.x += (tx - W3.seoa.x) * 0.04; W3.seoa.z += (tz - W3.seoa.z) * 0.04; }
  W3.seoaMesh.position.set(W3.seoa.x, 1.35 + Math.sin(now / 900) * 0.03, W3.seoa.z); W3.seoaMesh.lookAt(camera.position);
  // 관객: 늘 나를 보고, 웃을 때 다 같이 들썩인다
  if (now > W3.nextLaugh) { W3.nextLaugh = now + 6000 + Math.random() * 3000; W3.bob = now; crowdLaugh(); }
  const lift = now - W3.bob < 800 ? Math.abs(Math.sin((now - W3.bob) / 800 * Math.PI * 4)) * 0.06 : 0;
  W3.audience.concat(W3.extras).forEach((m) => { m.position.y = m.userData.baseY + lift; m.lookAt(camera.position.x, m.position.y, camera.position.z); });
  // 단장: 안 볼 때만 다가온다
  const D = W3.dan;
  if (D.active) {
    W3.danMesh.position.set(D.x, 1.3, D.z); W3.danMesh.lookAt(camera.position.x, 1.3, camera.position.z);
    if (!W3.auto && box.hidden && now > D.grace && !danSeen() && now - D.lastMove > 700) {
      const dx = W3.x - D.x, dz = W3.z - D.z, d = Math.hypot(dx, dz), s = Math.min(0.9, d);
      D.x += dx / d * s; D.z += dz / d * s; D.lastMove = now; setPannerPos(D.panner, D.x, 0.2, D.z); stepAt(D.panner, 0.9);
      if (Math.random() < 0.5) flicker3();
    }
    if (!W3.auto && Math.hypot(W3.x - D.x, W3.z - D.z) < 0.9) { circusHooks.caught(); }
  }
  // 비상구 표지가 걸린 틈에 닿았는지
  const ea = EXITS[W3.exitIdx];
  if (!W3.auto && box.hidden && D.active && Math.hypot(W3.x - Math.cos(ea) * R_FLOOR, W3.z - Math.sin(ea) * R_FLOOR) < 1.3) circusHooks.reachedExit();
  renderer.render(scene3, camera);
  requestAnimationFrame(frame3);
}
/** 무대 한가운데에서 다시 시작 (잡혔을 때). 잡힐수록 무대 위에 얼굴 없는 사람이 늘어 서 있다. */
function resetCircus() {
  W3.x = 0; W3.z = 2; W3.yaw = 0; W3.pitch = 0; W3.seoa = { x: 0.8, z: 3 };
  Object.assign(W3.dan, { x: Math.cos(EXITS[4]) * 7.5, z: Math.sin(EXITS[4]) * 7.5, active: true, grace: performance.now() + 2500, lastMove: 0 });
  W3.exitShifts = 0; placeSign(1);
  for (let i = W3.extras.length; i < W3.breaks; i++) {
    const a = i * 2.1 + 0.7, tex = canvasTex(16, 40, (g) => { g.fillStyle = "#16110f"; g.fillRect(5, 0, 6, 3); g.fillStyle = "#d8cdbd"; g.fillRect(5, 2, 6, 7); g.fillStyle = "#d8dccf"; g.fillRect(3, 9, 10, 15); g.fillStyle = "#4d6b9a"; g.fillRect(4, 24, 3, 15); g.fillRect(9, 24, 3, 15); });
    W3.extras.push(addBillboard(tex, 0.55, 1.8, Math.cos(a) * 4.5, 0.9, Math.sin(a) * 4.5));
  }
}
/** 서 있는 사람 그림 (셔츠 색만 다르게). */
function standTex(shirt) {
  return canvasTex(16, 40, (g) => { g.fillStyle = "#16110f"; g.fillRect(5, 0, 6, 3); g.fillStyle = "#d8cdbd"; g.fillRect(5, 2, 6, 7); g.fillStyle = "#111"; g.fillRect(6, 5, 1, 1); g.fillRect(9, 5, 1, 1);
    g.fillStyle = shirt; g.fillRect(3, 9, 10, 15); g.fillStyle = "#2a2a3a"; g.fillRect(4, 24, 3, 15); g.fillRect(9, 24, 3, 15); });
}
/** 단장이 위험하다는 걸 먼저 보여 준다: 관객 하나가 일어나 틈으로 나가려다, 불이 깜빡이는 사이 사라진다. 설명은 없다. */
async function takenDemo() {
  const m = W3.leaver, seat = W3.emptySeat;
  const e = EXITS.reduce((b, x) => (Math.abs(Math.atan2(Math.sin(x - seat.a), Math.cos(x - seat.a))) < Math.abs(Math.atan2(Math.sin(b - seat.a), Math.cos(b - seat.a))) ? x : b));
  const to = { x: Math.cos(e) * 10, z: Math.sin(e) * 10 };
  W3.lookTarget = m; await wait(1600);
  m.material.map = standTex("#7a5a4a"); m.material.needsUpdate = true; m.scale.set(0.92, 2, 1); burst(300, 0.2, 0.1);
  for (let k = 0; k <= 40; k++) {
    const p = k / 40; m.position.x = seat.x + (to.x - seat.x) * p; m.position.z = seat.z + (to.z - seat.z) * p; m.userData.baseY = seat.y + 0.45 + (0.9 - seat.y - 0.45) * p;
    if (k % 8 === 0) burst(500, 0.05, 0.04); await wait(60);
  }
  flicker3(); W3.danMesh.position.set(Math.cos(e) * 10.9, 1.3, Math.sin(e) * 10.9); W3.danMesh.lookAt(W3.x, 1.3, W3.z);
  setPannerPos(W3.dan.panner, Math.cos(e) * 10.9, 0.2, Math.sin(e) * 10.9); stepAt(W3.dan.panner, 0.9);
  await wait(1000);
  W3.lights.forEach((l) => (l.intensity = 0)); W3.tubes.forEach((t) => t.material.color.setHex(0x111a16));
  await wait(600); m.visible = false;
  W3.lights.forEach((l) => (l.intensity = 0.8)); W3.tubes.forEach((t) => t.material.color.setHex(0xdfffe8));
  burst(120, 0.5, 0.25); await wait(900);
  crowdLaugh(); W3.bob = performance.now(); W3.lookTarget = W3.danMesh; await wait(1500);
}
/** 계단 4: 천막 안. 비상구는 두 번 옮겨 가고, 세 번째에 서아가 손을 내민다. */
function stair4Circus() {
  return new Promise((resolve) => {
    vn.scene = "black"; $("vn").hidden = true; box.hidden = true;
    if (!renderer) buildCircus();
    $("world").hidden = false; resize3D();
    const buzz = startBuzz();
    W3.ended = false; W3.last = 0; W3.nextLaugh = performance.now() + 3500; placeSign(1);
    W3.dan.active = false; W3.x = 0; W3.z = 2; W3.yaw = 0;
    requestAnimationFrame(frame3);
    const busy = (f) => { if (W3.busy) return; W3.busy = true; f().finally(() => { W3.busy = false; box.hidden = true; vn.big = false; }); };
    circusHooks = {
      grab: () => busy(async () => {
        W3.x *= 0.85; W3.z *= 0.85;
        await say("", "(객석에 올라가려는데, 서아가 내 소매를 잡는다.)");
        vn.face = "worry"; await say(S, "……앉지 말자. 나가자.");
      }),
      caught: () => busy(async () => {
        W3.dan.active = false; stinger(); try { navigator.vibrate && navigator.vibrate(250); } catch (e) {}
        W3.ended = true; $("world").hidden = true; await wait(1600);
        W3.breaks++; resetCircus(); $("world").hidden = false; W3.ended = false; W3.last = 0; requestAnimationFrame(frame3);
      }),
      reachedExit: () => busy(async () => {
        if (W3.exitShifts < 2) {
          W3.exitShifts++; burst(200, 0.4, 0.2); flicker3();
          let n; do { n = Math.floor(Math.random() * 6); } while (n === W3.exitIdx);
          placeSign(n);
          await say("", W3.exitShifts === 1 ? "(표지 아래는 막혀 있다. 고개를 드니 비상구 표지가 저쪽 틈에 걸려 있다.)" : "(또 막혀 있다. 표지가 또 옮겨 가 있다.)");
          if (W3.exitShifts === 1) { vn.face = "worry"; await say(S, "저거, 아까부터 저기 있었어?"); }
          return;
        }
        // 서아의 배신 (장치 8: 이 게임에서 단 한 번)
        W3.dan.active = false; W3.danMesh.visible = true;
        vn.face = "worry"; await say(S, "이쪽! 나 따라와.");
        await fakeChoice(["따라간다.", "따라가지 않는다."], 0);
        box.hidden = true; vn.big = false; W3.seoaFixed = true;
        const seat = W3.emptySeat;
        await new Promise((done) => { W3.auto = { t0: performance.now(), ms: 3200, from: { x: W3.x, z: W3.z }, to: { x: seat.x, z: seat.z, y: seat.y + 0.9 }, yaw: Math.atan2(seat.x, seat.z), y: 1.55, done }; W3.seoa = { x: seat.x * 0.85, z: seat.z * 0.85 }; });
        burst(160, 0.3, 0.25); await wait(600); crowdLaugh(); W3.bob = performance.now();
        await wait(1400);
        W3.seoaMesh.material.map = W3.seoaTex.wrong; W3.seoaMesh.material.needsUpdate = true;
        vn.face = "wrong"; await say(S, "자리에 앉아 주세요. 공연이 곧 시작합니다.", { speed: 70 });
        W3.ended = true; buzz.stop(); $("world").hidden = true; box.hidden = true; vn.big = false;
        await wait(1800); resolve();
      }),
    };
    W3.cut = true;
    busy(async () => {
      vn.face = "worry"; await say(S, "……여기, 서커스야?");
      box.hidden = true; await wait(2000);
      // 단장 등장: 맞은편 틈에서. 아직 움직이지 않는다.
      const a4 = EXITS[4]; W3.danMesh.position.set(Math.cos(a4) * 7.5, 1.3, Math.sin(a4) * 7.5); W3.danMesh.lookAt(0, 1.3, 2); W3.danMesh.visible = true;
      setPannerPos(W3.dan.panner, Math.cos(a4) * 7.5, 0.2, Math.sin(a4) * 7.5); stepAt(W3.dan.panner, 0.9);
      W3.lookTarget = W3.danMesh; await wait(1800);
      await say("단장", "자리에 앉아 주세요. 공연이 곧 시작합니다.", { pitch: 220 });
      box.hidden = true;
      await takenDemo();
      vn.face = "worry"; await say(S, "……나가자. 저기, 비상구.");
      box.hidden = true; W3.lookTarget = W3.sign; await wait(1600); W3.lookTarget = null; W3.cut = false;
      hint("왼쪽 아래를 누른 채 밀면 걷기\n나머지 화면을 끌면 둘러보기", 9000);
      const p = W3.danMesh.position;
      Object.assign(W3.dan, { x: p.x, z: p.z, active: true, grace: performance.now() + 5000, lastMove: 0 });
    });
  });
}
/** 장치 8: 무엇을 눌러도 forced번이 골라진 것처럼 처리한다 (한 번만 쓴다). */
function fakeChoice(labels, forced) {
  return new Promise((resolve) => {
    box.hidden = false; nameEl.textContent = ""; textEl.textContent = ""; choicesEl.innerHTML = ""; talk.waitTap = false;
    const btns = labels.map((l, i) => {
      const b = document.createElement("button"); b.id = "choice" + i; b.textContent = l;
      b.addEventListener("click", () => {
        if (choicesEl.dataset.done) return; choicesEl.dataset.done = "1";
        b.style.borderColor = "var(--pick)"; blip(880, 0.03);
        setTimeout(() => { b.style.borderColor = ""; btns[forced].style.borderColor = "var(--pick)"; btns[forced].style.color = "var(--pick)"; blip(440, 0.03); }, 380);
        setTimeout(() => { choicesEl.innerHTML = ""; delete choicesEl.dataset.done; resolve(forced); }, 1300);
      });
      choicesEl.appendChild(b); return b;
    });
  });
}

/* ===================== 흐름 ===================== */
/** 처음부터 끝까지 (지금은 3단계: 계단 0~4). from=2면 상가부터, 3이면 서커스부터. */
async function main(from) {
  $("vn").hidden = false; requestAnimationFrame(frame);
  if (from < 2) { await stair0(); await stair1Bus(); await stair1Room(); }
  $("flash").classList.remove("on");
  if (from < 3) { await stair2Mall(); await stair3Corridor(); }
  $("flash").classList.remove("on");
  await stair4Circus();
  store.set("main-visits", visits + 1);
  box.hidden = true; $("vn").hidden = true; $("end").hidden = false; $("flash").classList.remove("on");
}
$("startBtn").addEventListener("click", () => { initAudio(); $("start").hidden = true; main(1); });
$("stage2Btn").addEventListener("click", () => { initAudio(); $("start").hidden = true; main(2); });
$("stage3Btn").addEventListener("click", () => { initAudio(); $("start").hidden = true; main(3); });
$("againBtn").addEventListener("click", () => location.reload());
</script>
