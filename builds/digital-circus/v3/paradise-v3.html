<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>낙원 서비스</title>
<style>
/* 레이아웃: 폰 세로 한 화면. 장마다 층이 바뀐다: 미연시 캔버스(일상·들판·엔딩) / 옛 채팅창(누리) / 3D(서커스). */
:root {
  --bg: #03110c; --ink: #d9eadf; --dim: #7fa392; --box: rgba(6, 22, 17, 0.88); --line: #3f8a66; --pick: #e8c86a;
  --term: #39ff8a; /* 누리와 시스템 안내의 초록 글씨 (귀환 축하도 같은 색·글꼴) */
  --font: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --mono: "DungGeunMo", "D2Coding", "Consolas", "Malgun Gothic", monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden; }
#app { position: relative; height: 100%; max-width: 480px; margin: 0 auto; overflow: hidden; background: var(--bg); user-select: none; -webkit-user-select: none; touch-action: none; }
.layer { position: absolute; inset: 0; }
canvas.pix { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; object-fit: cover; }
.sprite { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 58%; max-width: 280px; image-rendering: pixelated; pointer-events: none; }
#flash { background: #f2f8ee; opacity: 0; pointer-events: none; transition: opacity 1.2s; }
#flash.on { opacity: 1; }
#flash.green { background: var(--term); }
.screen { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; text-align: center; padding: 24px 16px; }
.screen h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: 0.08em; margin: 0; }
.screen p { color: var(--dim); margin: 0; line-height: 1.7; font-size: 0.95rem; }
.screen .small { font-size: 0.8rem; }
button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); padding: 12px 22px; border-radius: 2px; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--pick); outline-offset: 2px; }
#start button.sub { padding: 8px 16px; font-size: 0.85rem; color: var(--dim); }

#box { position: absolute; left: 10px; right: 10px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); min-height: 118px; background: var(--box); border: 1px solid var(--line); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; z-index: 5; }
#name { font-size: 0.8rem; color: var(--line); letter-spacing: 0.12em; min-height: 1em; }
#text { font-size: 1.05rem; line-height: 1.6; min-height: 1.6em; white-space: pre-wrap; }
#text.narr { color: var(--dim); }
#choices { display: flex; flex-direction: column; gap: 8px; }
#choices button { text-align: left; padding: 10px 14px; }
#hint { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px; text-align: center; font-size: 0.95rem; line-height: 1.6; background: var(--box); border: 1px solid var(--line); padding: 10px 12px; transition: opacity 1.5s; pointer-events: none; white-space: pre-line; z-index: 6; }
#hud { position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); right: 10px; font-size: 0.8rem; background: var(--box); border: 1px solid var(--line); padding: 4px 8px; z-index: 6; pointer-events: none; }
#hud.warn { border-color: #e86a5a; color: #ffd0c8; }
#labels { pointer-events: none; }
#labels span { position: absolute; transform: translate(-50%, -100%); font-size: 0.68rem; background: rgba(3, 17, 12, 0.7); padding: 1px 5px; white-space: nowrap; }
#gl { touch-action: none; }
#stick { position: absolute; width: 76px; height: 76px; border: 1px solid var(--line); border-radius: 50%; transform: translate(-50%, -50%); background: rgba(6, 22, 17, 0.35); pointer-events: none; }

/* 옛 채팅창: 검은 바탕 초록 글씨. 위쪽에 도트로 선 두 사람 */
#term { background: #010a05; color: var(--term); font-family: var(--mono); display: flex; flex-direction: column; }
#termHead { height: 22%; border-bottom: 1px dashed #1f6a3e; }
#termLog { flex: 1; overflow-y: auto; padding: 12px 14px; font-size: 0.95rem; line-height: 1.65; white-space: pre-wrap; word-break: keep-all; }
#termLog .me { color: #e6f6d8; }
#termLog .seoa { color: #9fd8ff; }
#termLog .sys { color: var(--term); }
#termLog .narr { color: #4f9a6a; }
#termLog .big { font-size: 1.5rem; text-align: center; padding: 30px 0; }
#termPick { display: flex; flex-direction: column; gap: 6px; padding: 0 12px 8px; }
#termPick button { color: var(--term); border-color: #1f6a3e; font-family: var(--mono); text-align: left; padding: 9px 12px; }
#termIn { padding: 8px 14px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid #1f6a3e; min-height: 1.4em; color: #e6f6d8; }
#termIn::before { content: "> "; color: var(--term); }
#term.shake { animation: shake 0.12s infinite; }
@keyframes shake { 0% { transform: translate(2px, -1px); } 50% { transform: translate(-2px, 1px); } 100% { transform: translate(1px, 2px); } }

/* 시련: 깨져 가는 창 안의 글자 탄막 */
#shoot { display: flex; align-items: center; justify-content: center; background: rgba(1, 10, 5, 0.6); z-index: 4; }
#win { position: relative; width: 86%; max-width: 380px; border: 2px solid var(--term); background: #010a05; transition: transform 0.25s; }
#winBar { display: flex; justify-content: space-between; align-items: center; background: var(--term); color: #010a05; font-family: var(--mono); font-size: 0.8rem; padding: 2px 6px; }
#winX { position: relative; color: #010a05; border: 1px solid #010a05; padding: 0 6px; font-size: 0.8rem; line-height: 1.3; transition: left 0.15s, top 0.15s; }
#shootCv { width: 100%; aspect-ratio: 1; display: block; image-rendering: pixelated; touch-action: none; }
#shootInfo { font-family: var(--mono); color: var(--term); font-size: 0.8rem; padding: 4px 6px; display: flex; justify-content: space-between; }

/* 들판의 친절한 창 (다크 패턴): 밝고 둥글고 매끄러움. 채팅창의 고장 난 결과 정반대 */
#dp { position: absolute; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center; background: rgba(255, 240, 230, 0.35); padding: 18px; }
#dp .card { background: #fffaf3; color: #4a3a32; width: 100%; max-width: 330px; border-radius: 18px; padding: 22px 20px 14px; box-shadow: 0 10px 30px rgba(120, 60, 40, 0.25); text-align: center; font-family: var(--font); }
#dp h2 { font-size: 1.05rem; margin: 0 0 8px; }
#dp p { font-size: 0.9rem; line-height: 1.55; margin: 0 0 16px; color: #7a6258; }
#dp .big { display: block; width: 100%; background: #ff8a6a; color: #fff; border: 0; border-radius: 999px; padding: 13px; font-weight: 600; margin-bottom: 8px; }
#dp .opt { display: block; width: 100%; background: #fff; color: #4a3a32; border: 1px solid #f0d8cc; border-radius: 12px; padding: 10px; margin-bottom: 6px; }
#dp .small { background: none; border: 0; color: #c8b8b0; font-size: 0.72rem; padding: 6px; }

#end .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
</style>

<div id="app">
  <div id="start" class="layer screen">
    <h1>낙원 서비스</h1>
    <p>v3 첫 판 · 그림 없이 여정 전체 (25분 안팎)<br>이어폰을 끼고 해 줘. 화면을 누르면 다음으로.</p>
    <button id="startBtn">처음부터</button>
    <p class="small">확인용: 장부터 시작</p>
    <button class="sub" data-from="1">채팅창부터</button>
    <button class="sub" data-from="2">들판부터</button>

  </div>
  <div id="vn" class="layer" hidden><canvas id="vnCanvas" class="pix" width="135" height="240"></canvas></div>
  <img id="seoa" class="sprite" alt="서아" hidden>
  <div id="world" class="layer" hidden><canvas id="gl" class="pix"></canvas><div id="stick" hidden></div></div>
  <div id="term" class="layer" hidden><canvas id="termHead" class="pix" width="120" height="40"></canvas><div id="termLog"></div><div id="termPick"></div><div id="termIn"></div></div>
  <div id="shoot" class="layer" hidden><div id="win"><div id="winBar"><span id="winTitle">누리.exe</span><span id="winX">×</span></div><canvas id="shootCv" width="120" height="120"></canvas><div id="shootInfo"><span id="shootHp"></span><span id="shootPhase"></span></div></div></div>
  <div id="labels" class="layer"></div>
  <div id="hud" hidden></div>
  <div id="hint" hidden></div>
  <div id="box" hidden><div id="name"></div><div id="text"></div><div id="choices"></div></div>
  <div id="dp" hidden><div class="card"><h2 id="dpTitle"></h2><p id="dpMsg"></p><div id="dpBtns"></div></div></div>

  <div id="end" class="layer screen" hidden>
    <h1>첫 판 끝</h1>
    <p>어느 순간이 제일 무서웠는지,<br>엔딩 뒤에 무슨 생각이 들었는지 기억해 둬.</p>
    <p class="small" id="endVer"></p>
    <div class="row"><button id="otherEndBtn">엔딩 다른 판 보기</button><button id="againBtn">처음부터</button></div>
  </div>
</div>

<!-- three.js r128: 서커스 3D 장면 (v2에서 검증한 부품을 그대로 씀). 전역 THREE를 주는 UMD 빌드, MIT 라이선스 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* v3 첫 판. 아래 '공용 부품'은 v2/circus-v2.html에서 그대로 가져왔다(소리·대화창·2D 걷기·3D 서커스). v3에서 새로 쓴 건 맨 아래 '장' 단위 함수들. */
const $ = (id) => document.getElementById(id);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const S = "서아";
/* ===================== 공용 부품 (v2에서 그대로): 기억 · 소리 ===================== */
/* ===================== 기억 (장치 6: 다시 열면 기억함) ===================== */
/** 이 브라우저에만 남는 기록 (막히면 처음 온 사람으로 취급). */
const store = {
  get(k, d) { try { const v = localStorage.getItem("dcv3-" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("dcv3-" + k, JSON.stringify(v)); } catch (e) {} },
};
const visits = store.get("main-visits", 0);

/* ===================== 소리 (장치 7, WebAudio 합성) ===================== */
let ac = null, master = null, noiseBuf = null;
/** 사용자가 누른 뒤에만 오디오를 연다 (브라우저 정책). */
function initAudio() {
  if (ac) return; // 한 번만 연다
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
}
/** 짧게 잦아드는 잡음 버퍼 (발소리·문소리·빗소리 재료). */
function noise() {
  if (!noiseBuf) {
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}
/** 버스 엔진 웅웅거림. 멈추는 함수를 돌려준다. */
function startEngine() {
  const g = ac.createGain(); g.gain.value = 0.13;
  const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 150;
  const o1 = ac.createOscillator(), o2 = ac.createOscillator(), lfo = ac.createOscillator(), lg = ac.createGain();
  o1.type = o2.type = "sawtooth"; o1.frequency.value = 47; o2.frequency.value = 47.7;
  lfo.frequency.value = 0.35; lg.gain.value = 0.04; lfo.connect(lg); lg.connect(g.gain);
  o1.connect(f); o2.connect(f); f.connect(g); g.connect(master);
  [o1, o2, lfo].forEach((o) => o.start());
  return () => { [o1, o2, lfo].forEach((o) => { try { o.stop(); } catch (e) {} }); g.disconnect(); };
}
/** 빗소리. 세기를 바꿀 수 있는 gain을 돌려준다. */
function startRain(vol) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noise(); s.loop = true; f.type = "bandpass"; f.frequency.value = 2400; f.Q.value = 0.6; g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(master); s.start(); return g;
}
/** 램프 지잉 소리. 높이를 바꿀 수 있게 oscillator를 돌려준다. */
function startHum() {
  const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
  o.type = "square"; o.frequency.value = 100; f.type = "bandpass"; f.frequency.value = 800; f.Q.value = 3; g.gain.value = 0.018;
  o.connect(f); f.connect(g); g.connect(master); o.start(); return o;
}
/** 돌아가는 세탁기: 낮은 웅웅거림에 통이 구르는 박자. 멈추는 함수를 돌려준다. */
function startWasher() {
  const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
  o.type = "triangle"; o.frequency.value = 62; f.type = "lowpass"; f.frequency.value = 220; g.gain.value = 0.07;
  lfo.frequency.value = 0.9; lg.gain.value = 0.05; lfo.connect(lg); lg.connect(g.gain);
  o.connect(f); f.connect(g); g.connect(master); o.start(); lfo.start();
  return () => { try { o.stop(); lfo.stop(); } catch (e) {} g.disconnect(); };
}
/** 글자 소리. */
function blip(pitch, vol) {
  if (!ac || !pitch) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = "square"; o.frequency.value = pitch;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.05);
}
/** 짧은 잡음 한 번 (문 열림 쉬익, 딸깍 등). */
function burst(freq, dur, vol) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime;
  s.buffer = noise(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 1;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.05);
}
/** 벽시계 초침. 가끔 한 박을 건너뛰거나 두 번 친다. 멈추는 함수를 돌려준다. */
function startClock() {
  let alive = true, n = 0;
  const tick = () => {
    if (!alive) return;
    n++;
    const skip = n > 6 && Math.random() < 0.12, dbl = n > 6 && Math.random() < 0.08;
    if (!skip) burst(4200, 0.02, 0.05);
    if (dbl) setTimeout(() => burst(4200, 0.02, 0.05), 140);
    setTimeout(tick, 1000);
  };
  tick(); return () => { alive = false; };
}
/** 문 너머 오르골 왈츠. 시간이 갈수록 음이 틀어진다. 멈추는 함수와 '잠깐 멈춤' 함수를 돌려준다. */
function startMusicBox() {
  const melody = [76, 79, 84, 83, 79, 76, 74, 77, 81, 79, 76, 72]; // 미디 번호, 3/4박
  const out = ac.createGain(), f = ac.createBiquadFilter();
  out.gain.value = 0.0; f.type = "lowpass"; f.frequency.value = 1800; // 문 너머라 먹먹하게
  out.connect(f); f.connect(master);
  out.gain.linearRampToValueAtTime(0.06, ac.currentTime + 6);
  let alive = true, i = 0, drift = 0, paused = false;
  const play = () => {
    if (!alive) return;
    if (!paused) {
      const t = ac.currentTime, m = melody[i % melody.length] + drift * (Math.random() - 0.3);
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "triangle"; o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
      g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + 1);
      i++; drift = Math.min(1.6, drift + 0.02);
    }
    setTimeout(play, i % 3 === 0 ? 520 : 400 + drift * 60);
  };
  play();
  return { stop() { alive = false; out.gain.value = 0; }, pause(ms) { paused = true; setTimeout(() => (paused = false), ms); } };
}

/** 고정 시드 난수 (불빛 자리가 매번 같게). */
function seeded(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const cityDots = (() => { const r = seeded(7); return Array.from({ length: 40 }, () => [r(), r()]); })();
/** 다각형 채우기. */
function poly(pts, c) { vx.fillStyle = c; vx.beginPath(); vx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) vx.lineTo(pts[i], pts[i + 1]); vx.fill(); }

/* ===================== v3: 미연시 캔버스 장면들 (일상·카페·파노라마·엔딩 거실) ===================== */
const vc = $("vnCanvas"), vx = vc.getContext("2d");
const vn = { scene: "black", big: false, face: "calm", glitch: 0, day: false, crt: 0, unplug: false, danFace: false, pano: "conv", zoom: 1, turn: null, orgelShake: 0 };
const NURI = 330; // 누리·시스템 안내 목소리 높이 (귀환 축하도 같은 높이)

/** 작은 사람 하나 (엔딩·파노라마용, s배 크기). face: up(뒷모습)/left/right/down. */
function personAt(x, y, body, s, face, hair) {
  const p = (a, b, w, h, c) => { vx.fillStyle = c; vx.fillRect(Math.round(x + a * s), Math.round(y + b * s), Math.ceil(w * s), Math.ceil(h * s)); };
  p(1, 7, 1, 2, "#1a1a22"); p(3, 7, 1, 2, "#1a1a22"); p(0, 3, 5, 4, body); p(1, 0, 3, 3, "#e6d6c3");
  p(1, 0, 3, face === "up" ? 3 : 1, hair || "#16110f");
  if (face === "left") { p(0, 0, 1, 2, hair || "#16110f"); p(1, 1, 1, 1, "#111"); }
  if (face === "right") { p(4, 0, 1, 2, hair || "#16110f"); p(3, 1, 1, 1, "#111"); }
  if (face === "down") { p(1, 1, 1, 1, "#111"); p(3, 1, 1, 1, "#111"); }
}
/** 0장·귀환: 평일 밤(또는 아침)의 자취방. 구석의 오래된 컴퓨터. */
function drawStudio(t) {
  const d = vn.day;
  vx.fillStyle = d ? "#c9d2c8" : "#1a262c"; vx.fillRect(0, 0, 135, 170);
  for (let y = 170; y < 240; y += 6) { vx.fillStyle = (y / 6) % 2 ? (d ? "#a8865a" : "#3a2c22") : (d ? "#9a7a50" : "#33271e"); vx.fillRect(0, y, 135, 6); }
  vx.fillStyle = d ? "#bfe4f2" : "#0b1830"; vx.fillRect(10, 30, 44, 46); // 창
  if (!d) { vx.fillStyle = "#e8c86a"; [[14, 60], [20, 52], [33, 64], [44, 58], [48, 66], [26, 70]].forEach(([a, b]) => vx.fillRect(a, b, 1, 1)); }
  vx.fillStyle = d ? "#8a9a92" : "#2a3a40"; vx.fillRect(10, 52, 44, 2); vx.fillRect(31, 30, 2, 46);
  vx.fillStyle = d ? "#e8eef0" : "#3a4a5a"; vx.fillRect(0, 172, 58, 24); vx.fillStyle = d ? "#f4f6f4" : "#4a5a6a"; vx.fillRect(2, 168, 18, 8); // 침대
  vx.fillStyle = d ? "#7a5a3a" : "#3a2a1e"; vx.fillRect(76, 124, 56, 5); vx.fillRect(80, 129, 3, 40); vx.fillRect(126, 129, 3, 40); // 책상

/** 마지막 장면. A판 = 오르골 한 음만 틀어짐. B판 = 같고, 그 순간 서아가 한 박자 늦게 돌아봄 + 한 프레임 끊김. 글은 없다. */
async function homeScene(ver) {
  $("vn").hidden = false; box.hidden = true; vn.scene = "home"; vn.zoom = 1; vn.turn = null; vn.orgelShake = 0; vn.glitch = 0;
  await wait(2600);
  for (let k = 0; k <= 60; k++) { vn.zoom = 1 + 0.5 * (k / 60) * (k / 60); await wait(50); }
  await wait(900);
  await playOrgel({ vol: 0.07, wrongAt: 5, stopAfterWrong: true, onWrong: () => {
    const now = performance.now(); vn.orgelShake = 1; vn.glitch = 1.2;
    vn.turn = { me: now + 60, seoa: now + (ver === "B" ? 520 : 60) };
    if (ver === "B") setTimeout(() => { vn.freezeUntil = performance.now() + 140; }, 520);
    setTimeout(() => { vn.glitch = 0; vn.orgelShake = 0; }, 260);
  } });
  await wait(1800);
  vn.scene = "black"; await wait(2200);
}
async function ch5Ending(ver) { await panorama(); await homeScene(ver); }

/* ===================== 흐름 ===================== */
let ENDV = "A";
/** 끝 화면: 이번에 본 엔딩 판을 적고, 다른 판을 바로 볼 수 있게. */
function showEnd() {
  box.hidden = true; $("vn").hidden = true; $("world").hidden = true; $("hud").hidden = true;
  $("endVer").textContent = "이번 엔딩: " + ENDV + "판 (A·B는 마지막 장면만 다름)"; $("end").hidden = false;
}
/** 처음부터 끝까지. from: 0 일상 · 1 채팅창 · 2 들판 · 3 서커스 · 4 귀환·엔딩. */
async function main(from) {
  requestAnimationFrame(frame);
  if (from <= 0) await ch0Daily();
  if (from <= 1) await ch1Chat();
  if (from <= 2) { await ch2Field(); await ch2Under(); }
  if (from <= 3) await ch3Circus();
  await ch4Return(); await ch5Ending(ENDV);
  store.set("main-visits", visits + 1);
  showEnd();
}
const go = (from) => { initAudio(); $("start").hidden = true; main(from); };
$("startBtn").addEventListener("click", () => go(0));
document.querySelectorAll("#start .sub").forEach((b) => b.addEventListener("click", () => go(+b.dataset.from)));
$("otherEndBtn").addEventListener("click", async () => {
  ENDV = ENDV === "A" ? "B" : "A"; $("end").hidden = true; await homeScene(ENDV); showEnd();
});
$("againBtn").addEventListener("click", () => location.reload());
</script>
