<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>낙원 서비스 · 0장</title>
<!-- Noto Sans KR: 미연시 대화창 글꼴 (Google Fonts, OFL). 아티팩트에서도 허용되는 글꼴 호스트 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
  :root{ --ink:#1d2433; --paper:rgba(250,250,252,.9); --tag:#2e3a59; --line:rgba(46,58,89,.25); --hi:#ffd166; }
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Noto Sans KR',system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
  canvas#view{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
  .layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;opacity:0;transition:opacity .9s}
  #bg.sway{animation:sway 6s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:scale(1.04) translate(0,0)}50%{transform:scale(1.04) translate(-.4%,.3%)}}
  #dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
  #stand{position:absolute;left:50%;bottom:0;height:86%;transform:translateX(-50%);pointer-events:none;opacity:0;transition:opacity .3s,filter .25s}
  #stand.dark{filter:brightness(.55)}
  #box{position:absolute;left:6%;right:6%;bottom:max(4%,env(safe-area-inset-bottom));min-height:120px;background:var(--paper);border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.35);display:none;pointer-events:none;padding:26px 30px 22px}
  #box .name{position:absolute;top:-18px;left:22px;background:var(--tag);color:#fff;font-weight:700;font-size:18px;padding:4px 18px;border-radius:4px}
  #box .name:empty{display:none}
  #box .text{color:var(--ink);font-size:clamp(17px,2.3vw,24px);line-height:1.6;letter-spacing:.2px;min-height:2.6em}
  #box .next{position:absolute;right:18px;bottom:10px;color:var(--tag);font-size:14px;opacity:0;animation:blink 1s infinite}
  #box.done .next{opacity:1}
  @keyframes blink{50%{opacity:.2}}
  #choices{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);display:none;flex-direction:column;gap:12px;min-width:min(420px,80vw)}
  #choices button{font-family:inherit;font-size:clamp(16px,2vw,21px);background:var(--paper);color:var(--ink);border:2px solid var(--tag);border-radius:6px;padding:12px 22px;cursor:pointer;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  #choices button:hover,#choices button:focus-visible{background:var(--tag);color:#fff;outline:none}
  #label{position:absolute;padding:3px 9px;background:rgba(0,0,0,.7);color:#fff;font-size:14px;border-radius:3px;pointer-events:none;display:none}
  #hint{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);color:#fff;font-size:13px;opacity:0;transition:opacity 1s;background:rgba(0,0,0,.45);padding:4px 12px;border-radius:12px;pointer-events:none}
  #cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.55);display:none;pointer-events:none}
  #fade{position:absolute;inset:0;background:#000;opacity:1;pointer-events:none}
  #start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#05060a;color:#e8e8ee;cursor:pointer}
  #start h1{font-size:40px;margin:0;letter-spacing:6px;font-weight:700}
  #start p{margin:0;opacity:.7}
  #end{position:absolute;inset:0;display:none;background:#000;color:#3f3;font-family:ui-monospace,Consolas,monospace;font-size:22px;padding:8% 10%;white-space:pre-wrap}
  #err{position:absolute;top:10px;left:10px;color:#f66;font-size:14px;white-space:pre-wrap}
  @media (prefers-reduced-motion:reduce){#bg.sway{animation:none}}
</style>
</head>
<body>
<canvas id="view"></canvas>
<img id="bg" class="layer" alt="">
<img id="cg" class="layer" alt="">
<div id="dim"></div>
<img id="stand" alt="">
<div id="cross"></div>
<div id="label"></div>
<div id="hint">끌어서 둘러보기 · 눌러서 걷거나 살펴보기 · WASD로 걷기</div>
<div id="box"><div class="name"></div><div class="text"></div><div class="next">▼</div></div>
<div id="choices"></div>
<div id="fade"></div>
<div id="end"></div>
<div id="start"><h1>낙원 서비스</h1><p>0장 · 일상</p><p>눌러서 시작 (소리가 나요)</p></div>
<div id="err"></div>

<!-- three.js r128: 1인칭 PS1~2풍 3D (v2·v3에서 검증한 버전), MIT 라이선스 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- inkjs 2.3.2 full: Ink 대본을 브라우저에서 바로 컴파일·실행. 대사를 코드와 분리하려고 씀. MIT 라이선스 -->
<script src="https://cdn.jsdelivr.net/npm/inkjs@2.3.2/dist/ink-full.js"></script>
<script>
// ───────────────────────── 설정 ─────────────────────────
// 대본은 비밀 폴더에만 있음(스포일러 규칙). 서버 루트 = builds/digital-circus
const INK_URL = '../script/secret/v4-ch0.ink';
const LOW_W = 400, LOW_H = 240;   // PS1~2풍 저해상도 렌더 크기
const EYE = 1.58;                 // 눈높이 (m)
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ───────────────────────── 소리 (WebAudio 합성) ─────────────────────────
let AC = null, master = null, humNode = null;
/** 오디오 시작 (누른 뒤에만 가능) */
function initAudio(){ AC = new AudioContext(); master = AC.createGain(); master.gain.value = .5; master.connect(AC.destination); }
/** 짧은 음 하나 */
function tone(freq, dur, type='sine', vol=.2, when=0){
  if(!AC) return; const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t+dur);
  o.connect(g).connect(master); o.start(t); o.stop(t+dur+.05);
}
/** 잡음 한 덩이 (덜컹·철컥) */
function noise(dur, vol=.3, freq=800, when=0){
  if(!AC) return; const t = AC.currentTime + when, n = AC.createBufferSource(), b = AC.createBuffer(1, AC.sampleRate*dur, AC.sampleRate);
  const d = b.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
  const f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value = freq; const g = AC.createGain(); g.gain.value = vol;
  n.buffer = b; n.connect(f).connect(g).connect(master); n.start(t);
}
/** 배경 웅웅 소리 (버스 엔진 / 형광등·세탁기) */
function hum(freq, vol){
  if(!AC) return; if(humNode){ humNode.g.gain.setTargetAtTime(0, AC.currentTime, .3); humNode.o.stop(AC.currentTime+1.5); humNode = null; }
  if(!vol) return;
  const o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
  o.type='sawtooth'; o.frequency.value = freq; f.type='lowpass'; f.frequency.value = 180; g.gain.value = 0;
  o.connect(f).connect(g).connect(master); o.start(); g.gain.setTargetAtTime(vol, AC.currentTime, .5); humNode = {o,g};
}
/** 효과음 이름 → 소리 */
const SFX = {
  keyring(){ [2093,2637,3136].forEach((f,i)=>tone(f,.25,'triangle',.08,i*.07)); },
  washer_start(){ noise(.6,.25,300); tone(880,.12,'square',.08,.1); },
  washer_done(){ [0,.35,.7].forEach(w=>tone(1320,.18,'square',.1,w)); },
  washer_open(){ noise(.25,.3,1200); },
  can(){ noise(.3,.4,500); tone(220,.2,'triangle',.15,.15); },
  door_lock(){ noise(.12,.6,2500); tone(140,.15,'square',.2); },
  door_rattle(){ for(let i=0;i<5;i++) noise(.08,.45,1500,i*.09); },
  phone_ring(){ for(let i=0;i<3;i++){ tone(440,.9,'sine',.1,i*1.4); tone(480,.9,'sine',.1,i*1.4); } },
  phone_cut(){ [0,.3,.6].forEach(w=>tone(480,.2,'square',.08,w)); },
  latch(){ noise(.05,.6,4000); noise(.08,.3,900,.06); },
  blip(){ tone(620+Math.random()*60,.025,'square',.018); },
};

// ───────────────────────── 3D 기본 (PS1~2풍) ─────────────────────────
const renderer = new THREE.WebGLRenderer({canvas:$('view'), antialias:false});
renderer.setPixelRatio(1); renderer.setSize(LOW_W, LOW_H, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.BasicShadowMap;
const camera = new THREE.PerspectiveCamera(62, LOW_W/LOW_H, .05, 120);
camera.rotation.order = 'YXZ';
const scene = new THREE.Scene();
const clock = new THREE.Clock();
const loader = new THREE.TextureLoader();
const TEX = {};

/** 저해상도 텍스처 (최근접 필터 = 옛날 게임 질감) */
function px(t){ t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; return t; }
/** 캔버스에 그려서 텍스처 만들기 */
function canvasTex(w, h, draw){ const c = document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'), w, h); return px(new THREE.CanvasTexture(c)); }
/** PS1처럼 꼭짓점이 화면 격자에 붙어 살짝 떨리게 하는 재질 */
function psx(mat){
  mat.onBeforeCompile = sh => { sh.vertexShader = sh.vertexShader.replace('#include <project_vertex>',
    '#include <project_vertex>\n vec2 g = vec2(200.0,120.0); gl_Position.xy = floor(gl_Position.xy/gl_Position.w*g)/g*gl_Position.w;'); };
  return mat;
}
const lam = (opt) => psx(new THREE.MeshLambertMaterial(opt));
/** 상자 하나 (재질 하나 또는 면별 재질 배열) */
function box(w,h,d,mat,x,y,z){ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m; }
/** 판 하나 */
function plane(w,h,mat,x,y,z,rx=0,ry=0){ const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), mat); m.position.set(x,y,z); m.rotation.set(rx,ry,0); m.receiveShadow = true; scene.add(m); return m; }
/** 글자 판 텍스처 */
const signTex = (txt,bg,fg,w=96,h=28,size=13) => canvasTex(w,h,(g)=>{ g.fillStyle=bg; g.fillRect(0,0,w,h); g.fillStyle=fg; g.font=`bold ${size}px sans-serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillText(txt,w/2,h/2+1); });

// ───────────────────────── 미연시 대화 (Ink) ─────────────────────────
let story = null, busy = false, advance = null, seoaFace = 'calm', vnStand = false;
const box_ = $('box'), nameEl = box_.querySelector('.name'), textEl = box_.querySelector('.text'), stand = $('stand');
/** 서아 상반신 보이기/숨기기 (말하는 사람이 서아가 아니면 어둡게) */
function showStand(on, speaking){
  if($('cg').style.opacity === '1') on = false;   // 바깥 그림이 떠 있을 땐 그림을 가리지 않게
  stand.style.opacity = on ? 1 : 0;
  if(on){ stand.src = `img/vn-seoa-${seoaFace}.png`; stand.classList.toggle('dark', !speaking); }
}
/** 대사 한 줄 (글자 하나씩, 누르면 다음) */
function showLine(who, text){
  return new Promise(res => {
    box_.style.display = 'block'; box_.classList.remove('done'); nameEl.textContent = who || ''; textEl.textContent = '';
    showStand(vnStand, who === '서아');
    let i = 0, done = false;
    const finish = () => { done = true; box_.classList.add('done'); };
    const tick = setInterval(() => { if(i >= text.length){ clearInterval(tick); finish(); return; } textEl.textContent += text[i++]; if(i%2) SFX.blip(); }, 34);
    advance = () => { if(!done){ clearInterval(tick); textEl.textContent = text; finish(); } else { advance = null; res(); } };
  });
}
/** 선택창 */
function showChoices(list){
  return new Promise(res => {
    const el = $('choices'); el.innerHTML = ''; el.style.display = 'flex';
    list.forEach((c,i) => { const b = document.createElement('button'); b.textContent = c.text;
      b.onpointerup = e => { e.stopPropagation(); el.style.display='none'; res(i); }; el.appendChild(b); });
  });
}
/** 태그(# face/sfx/ev) 처리 */
async function handleTags(tags){
  for(const t of tags){ const [k,v] = t.split(':').map(s=>s.trim());
    if(k==='face'){ seoaFace = v; if(stand.style.opacity==='1') stand.src = `img/vn-seoa-${v}.png`; }
    else if(k==='sfx' && SFX[v]) SFX[v](); else if(k==='ev' && EV[v]) await EV[v](); }
}
/** Ink 장면(knot) 하나 끝까지 돌리기. 빨래방에서는 화면을 살짝 어둡게 하고 미연시 창을 띄움 */
async function runKnot(name){
  busy = true; story.ChoosePathString(name);
  if(mode === 'laundry'){ vnStand = true; $('dim').style.opacity = .35; $('label').style.display='none'; }
  while(true){
    while(story.canContinue){
      const raw = story.Continue().trim(); await handleTags(story.currentTags);
      if(!raw) continue; const m = raw.match(/^(나|서아):\s*(.*)$/);
      await showLine(m ? m[1] : '', m ? m[2] : raw);
    }
    if(!story.currentChoices.length) break;
    showStand(vnStand, false); const i = await showChoices(story.currentChoices); story.ChooseChoiceIndex(i);
  }
  box_.style.display = 'none';
  if(mode === 'laundry'){ vnStand = false; showStand(false); $('dim').style.opacity = 0; }
  busy = false;
}

// ───────────────────────── 장면 1: 버스 (미연시) ─────────────────────────
/** 밤 버스: 배경 그림 + 옆자리 서아 상반신 + 대화창 */
async function playBus(){
  mode = 'bus'; $('bg').src = 'img/bg-bus.jpg'; $('bg').classList.add('sway'); $('bg').style.opacity = 1;
  vnStand = true; await fade(0, 1200);
  await runKnot('bus');
  vnStand = false; showStand(false); hum(0,0); await fade(1, 1000);
  $('bg').style.opacity = 0; $('bg').classList.remove('sway');
}

// ───────────────────────── 장면 2: 코인빨래방 (1인칭 3D) ─────────────────────────
const W = {}; const clickables = [];
/** 물건 등록: 이름표, 다가설 자리, 바라볼 곳, 대본 knot */
function clickable(mesh, label, stand_, look, knot){ mesh.userData = {label, stand:stand_, look, knot}; clickables.push(mesh); return mesh; }

/** 빨래방 짓기: 방 8×6m (x -4~4, z -3~3), 천장 2.8m */
function buildLaundry(){
  scene.background = new THREE.Color(0x000000);
  scene.add(new THREE.AmbientLight(0xd8e4ff, .42));
  W.tubes = [[-1.8,-.8],[1.8,-.8],[0,1.6]].map(([x,z]) => { const l = new THREE.PointLight(0xf2f8ff, .75, 11, 1.4); l.position.set(x,2.6,z); l.castShadow = true; l.shadow.mapSize.set(256,256); scene.add(l);
    box(1.4,.05,.16, psx(new THREE.MeshBasicMaterial({color:0xffffff})),x,2.77,z); return l; });
  // 바닥·천장·벽
  const ft = TEX.floor; ft.wrapS = ft.wrapT = THREE.RepeatWrapping; ft.repeat.set(6,4.5);
  W.floor = plane(8,6,lam({map:ft}),0,0,0,-Math.PI/2);
  plane(8,6,lam({color:0xc9ccc6}),0,2.8,0,Math.PI/2);
  const wallTex = canvasTex(32,32,(g)=>{ g.fillStyle='#dfe3dc'; g.fillRect(0,0,32,32); g.fillStyle='#c9cec6'; for(let i=0;i<32;i+=8){ g.fillRect(i,0,1,32); g.fillRect(0,i,32,1); } });
  wallTex.wrapS = wallTex.wrapT = THREE.RepeatWrapping; wallTex.repeat.set(8,3);
  const wall = lam({map:wallTex});
  plane(8,2.8,wall,0,1.4,-3);                                   // 뒷벽
  plane(6,2.8,wall,4,1.4,0,0,-Math.PI/2);                       // 오른벽
  plane(8,2.8,wall,0,1.4,3,0,Math.PI);                          // 앞벽(등 뒤)
  // 왼벽: 유리 앞문(z 0.6~2.2)과 큰 창(z -2.6~-0.2)만 비우고 벽
  const lw = (z1,z2,y1,y2) => plane(z2-z1,y2-y1,wall,-4,(y1+y2)/2,(z1+z2)/2,0,Math.PI/2);
  lw(-3,-2.6,0,2.8); lw(-.2,.6,0,2.8); lw(2.2,3,0,2.8); lw(-2.6,-.2,0,.8); lw(-2.6,-.2,2.3,2.8); lw(.6,2.2,2.3,2.8);
  const glass = new THREE.MeshBasicMaterial({color:0xa8c8e8, transparent:true, opacity:.14, depthWrite:false});
  clickable(plane(2.4,1.5,glass,-3.99,1.55,-1.4,0,Math.PI/2),'창밖',[-3.0,-1.4],[-4,1.5,-1.4],'window');
  W.door = clickable(plane(1.6,2.3,glass.clone(),-3.98,1.15,1.4,0,Math.PI/2), '앞문', [-3.1,1.4], [-4,1.3,1.4], 'door');
  const frame = lam({color:0x8a8f96});
  box(.08,2.3,.06,frame,-3.98,1.15,.6); box(.08,2.3,.06,frame,-3.98,1.15,2.2); box(.08,.06,1.6,frame,-3.98,2.3,1.4);
  // 바깥: 어두운 밤거리 (자세한 모습은 바라볼 때 그림으로)
  plane(30,8,new THREE.MeshBasicMaterial({color:0x0b1020}),-12,3,0,0,Math.PI/2);
  plane(8,30,new THREE.MeshBasicMaterial({color:0x1a1c22}),-8,-.01,0,-Math.PI/2);
  for(let i=0;i<4;i++){ const b = new THREE.Mesh(new THREE.BoxGeometry(.4,.12,.25), new THREE.MeshBasicMaterial({color:0xffc875})); b.position.set(-7,2.6,-6+i*4); scene.add(b); }
  // 세탁기 6대 (뒷벽, 앞면 사진 질감)
  const side = lam({color:0xe8e8e2});
  W.washers = [];
  for(let i=0;i<6;i++){ const x = -3.3+i*.82;
    const front = lam({map:TEX.washer});
    const w = box(.76,1,.7,[side,side,side,side,front,side],x,.5,-2.62);
    if(i===1){ clickable(w,'세탁기',[x,-1.35],[x,.6,-2.6],'washer'); W.myX = x; } }
  // 내 세탁기 안에서 도는 빨래 (돌아갈 때만 보임)
  // 세탁기 앞면 사진의 둥근 유리 자리에 '돌아가는 빨래' 사진을 겹치고, 사진(텍스처)만 돌림
  W.myDrum = new THREE.Mesh(new THREE.CircleGeometry(.215,20), psx(new THREE.MeshLambertMaterial({map:TEX.drumWash})));
  W.myDrum.position.set(W.myX,.51,-2.266); W.myDrum.visible = false; scene.add(W.myDrum);
  // 건조기 3대 (회색, 3번은 아무도 없는데 돌아감)
  W.dryers = [];
  for(let i=0;i<3;i++){ const x = 1.85+i*.8;
    const d = box(.74,1.6,.7,[side,side,side,side,lam({map:TEX.washer, color:0xbfc3c8}),side],x,.8,-2.62);
    if(i===2){ const sp = new THREE.Mesh(new THREE.CircleGeometry(.215,20), psx(new THREE.MeshLambertMaterial({map:TEX.drumDry, emissive:0x2a1a08})));
      sp.scale.y = 1.6; /* 앞면 사진이 세로로 늘어나 있어서 타원 */ sp.position.set(x,.816,-2.266); scene.add(sp); W.dryerSpin = sp; clickable(d,'건조기',[x,-1.35],[x,.8,-2.6],'dryer'); } }
  // 직원용 뒷문 (오른벽 안쪽, 돌쩌귀로 열림)
  W.back = new THREE.Group(); W.back.position.set(3.97,0,-2.2);
  const bd = new THREE.Mesh(new THREE.BoxGeometry(.05,2.1,.9), lam({color:0x6b4a3a})); bd.position.set(0,1.05,.45); bd.castShadow = true; W.back.add(bd);
  const st = new THREE.Mesh(new THREE.PlaneGeometry(.5,.15), psx(new THREE.MeshBasicMaterial({map:signTex('STAFF ONLY','#fff','#111')}))); st.position.set(-.03,1.65,.45); st.rotation.y = -Math.PI/2; W.back.add(st);
  scene.add(W.back); clickable(bd,'직원용 문',[3.1,-1.75],[4,1.1,-1.75],'backdoor');
  W.backLight = new THREE.PointLight(0xfff3cf, 0, 6); W.backLight.position.set(3.6,1.2,-1.75); scene.add(W.backLight);
  plane(.88,2.08,new THREE.MeshBasicMaterial({color:0xfffbea}),3.995,1.05,-1.75,0,-Math.PI/2);   // 문 뒤 빛 판 (열리면 보임)
  // 자판기 (오른벽, 앞면 사진 질감)
  const vside = lam({color:0xb3262a});
  const vm = box(.7,1.85,.95,[vside,vside,vside,vside,lam({map:TEX.vending, emissive:0x220808}),vside],3.6,.93,.5);
  vm.rotation.y = -Math.PI/2; clickable(vm,'자판기',[2.6,.5],[4,1.1,.5],'vending');
  // 게시판 (오른벽)
  const board = canvasTex(64,40,(g)=>{ g.fillStyle='#a77a4c'; g.fillRect(0,0,64,40); const P=['#fff','#fff59d','#b3e5fc','#ffccbc','#fff','#c8e6c9'];
    for(let i=0;i<6;i++){ g.fillStyle=P[i]; g.fillRect(4+(i%3)*20,4+Math.floor(i/3)*18,14,14); g.fillStyle='#555'; for(let k=0;k<3;k++) g.fillRect(6+(i%3)*20,9+Math.floor(i/3)*18+k*3,10,1); }
    g.fillStyle='#e9f7f5'; g.fillRect(24,22,15,16); g.fillStyle='#4bb7b0'; g.fillRect(26,24,11,6); });
  clickable(plane(1.35,.9,lam({map:TEX.board}),3.98,1.55,2.1,0,-Math.PI/2),'게시판',[3.0,2.1],[4,1.5,2.1],'board');
  // 의자 (가운데, 세탁기를 바라봄)
  const blue = lam({color:0x2f4f8f});
  const bench = box(2,.42,.5,blue,0,.21,.2); box(2,.5,.08,blue,0,.62,.45);
  clickable(bench,'의자',[-.45,.22],[-.45,.7,-2.6],'chair');
  // 서아 (서 있는 판 / 앉은 판)
  W.seoa = new THREE.Sprite(new THREE.SpriteMaterial({map:TEX.seoaStand, transparent:true, alphaTest:.5}));
  W.seoa.center.set(.5,0); scene.add(W.seoa); placeSeoa('bench');   // 들어오자마자 앉아서 기다림
  // 나 (카메라)
  W.pos = new THREE.Vector3(-3.1,0,1.4); W.yaw = -Math.PI/2 + .5; W.pitch = -.05; W.target = null; W.bob = 0;
}
/** 서아를 정해진 자리에 세우기 (대화가 시작될 때 화면이 어두워진 틈에 옮김) */
const SEOA_SPOTS = { enter:[-2.6,2.2,'stand'], washer:[-1.1,-1.0,'stand'], dryer:[1.5,-.7,'stand'], vending:[2.7,1.3,'stand'], board:[2.9,1.1,'stand'],
                     bench:[.5,.16,'sit'], door:[-3.1,2.2,'stand'], backdoor:[2.7,-1.1,'stand'] };
function placeSeoa(key){
  const [x,z,pose] = SEOA_SPOTS[key] || SEOA_SPOTS.enter; const sit = pose === 'sit';
  W.seoa.material.map = sit ? TEX.seoaSit : TEX.seoaStand; W.seoa.material.needsUpdate = true;
  const h = sit ? 1.22 : 1.64, img = W.seoa.material.map.image; W.seoa.scale.set(h*img.width/img.height, h, 1);
  W.seoa.position.set(x, sit ? .02 : 0, z);
}

// ───────────────────────── 1인칭 걷기·둘러보기 ─────────────────────────
/** 걸어갈 곳 정하기 (방 안으로 제한) */
function walkTo([x,z], look){ x = Math.max(-3.6, Math.min(3.6, x)); z = Math.max(-1.75, Math.min(2.6, z)); W.target = {x, z, look}; return new Promise(r => W.onArrive = r); }
/** 한 프레임 진행: 걷기 + 바라볼 곳으로 고개 돌리기 */
function stepPlayer(dt){
  if(W.target){
    const dx = W.target.x - W.pos.x, dz = W.target.z - W.pos.z, len = Math.hypot(dx,dz);
    if(len > .04){ const s = Math.min(1, 1.6*dt/len); W.pos.x += dx*s; W.pos.z += dz*s; W.bob += dt*9;
      const want = Math.atan2(-dx,-dz); W.yaw += angDiff(want, W.yaw) * Math.min(1, dt*5); }
    else if(W.target.look){ const [lx,ly,lz] = W.target.look; const want = Math.atan2(-(lx-W.pos.x), -(lz-W.pos.z));
      const wp = Math.atan2(ly - (EYE + W.sitDrop), Math.hypot(lx-W.pos.x, lz-W.pos.z));
      W.yaw += angDiff(want, W.yaw) * Math.min(1, dt*6); W.pitch += (wp - W.pitch) * Math.min(1, dt*6);
      if(Math.abs(angDiff(want, W.yaw)) < .02){ const f = W.onArrive; W.target = null; W.onArrive = null; f && f(); } }
    else { const f = W.onArrive; W.target = null; W.onArrive = null; f && f(); }
  }
  camera.position.set(W.pos.x, EYE + W.sitDrop + Math.sin(W.bob)*.025, W.pos.z);
  camera.rotation.set(W.pitch, W.yaw, 0);
}
const angDiff = (a,b) => { let d = a-b; while(d > Math.PI) d -= 2*Math.PI; while(d < -Math.PI) d += 2*Math.PI; return d; };
W.sitDrop = 0;

// ───────────────────────── 입력 (누르기 = 걷기·살펴보기, 끌기 = 둘러보기) ─────────────────────────
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
/** 화면 좌표 → 3D 광선으로 맞은 것 */
function pick(cx, cy, list){ const r = $('view').getBoundingClientRect(); mouse.set((cx-r.left)/r.width*2-1, -(cy-r.top)/r.height*2+1); ray.setFromCamera(mouse, camera); return ray.intersectObjects(list, false)[0]; }
let mode = 'start', drag = null;
window.addEventListener('pointerdown', e => { drag = {x:e.clientX, y:e.clientY, moved:0, yaw:W.yaw, pitch:W.pitch}; });
window.addEventListener('pointermove', e => {
  if(drag && mode==='laundry' && !busy){ const dx = e.clientX-drag.x, dy = e.clientY-drag.y; drag.moved = Math.max(drag.moved, Math.hypot(dx,dy));
    if(drag.moved > 8){ W.target = null; W.yaw = drag.yaw + dx*.005; W.pitch = Math.max(-.7, Math.min(.5, drag.pitch + dy*.004)); } }
  if(mode!=='laundry' || busy || e.pointerType==='touch'){ $('label').style.display='none'; return; }
  const h = pick(e.clientX, e.clientY, clickables), L = $('label');
  if(h && h.distance < 6){ L.textContent = h.object.userData.label; L.style.left = e.clientX+14+'px'; L.style.top = e.clientY-8+'px'; L.style.display='block'; } else L.style.display='none';
});
window.addEventListener('pointerup', async e => {
  const wasDrag = drag && drag.moved > 8; drag = null;
  if(advance){ advance(); return; }
  if(wasDrag || mode!=='laundry' || busy || W.ending) return;
  const h = pick(e.clientX, e.clientY, clickables.concat([W.floor]));
  if(!h) return;
  if(h.object === W.floor){ walkTo([h.point.x, h.point.z]); return; }
  const u = h.object.userData; busy = true; $('label').style.display = 'none';
  W.sitDrop = 0;
  await walkTo(u.stand, u.look);
  await runKnot(u.knot); afterKnot(u.knot);
});
const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if((e.key===' '||e.key==='Enter') && advance){ e.preventDefault(); advance(); } });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
/** WASD·화살표: W/S 앞뒤, A/D 옆걸음, ←/→ 돌기 */
function stepKeys(dt){
  if(mode!=='laundry' || busy) return;
  const f = (keys.w||keys.arrowup?1:0) - (keys.s||keys.arrowdown?1:0), st = (keys.d?1:0) - (keys.a?1:0), tr = (keys.arrowleft?1:0) - (keys.arrowright?1:0);
  if(!f && !st && !tr) return;
  W.target = null; W.sitDrop = 0; W.yaw += tr*dt*1.8;
  const sp = 1.7*dt, sy = Math.sin(W.yaw), cy = Math.cos(W.yaw);
  W.pos.x = Math.max(-3.6, Math.min(3.6, W.pos.x - sy*f*sp + cy*st*sp));
  W.pos.z = Math.max(-1.75, Math.min(2.6, W.pos.z - cy*f*sp - sy*st*sp));
  if(f || st) W.bob += dt*9;
}

/** 대본 knot이 끝난 뒤 게임 상태 반영 */
function afterKnot(k){
  $('cg').style.opacity = 0;
  const v = n => story.variablesState[n];
  W.myDrum.visible = v('washed') && !v('waited');
  if(W.ending) finish();
}

// ───────────────────────── 연출 이벤트 (# ev:이름) ─────────────────────────
const fade = (to, ms=800) => { $('fade').style.transition = `opacity ${ms}ms`; $('fade').style.opacity = to; return sleep(ms); };
/** 제자리에서 고개만 돌리기 (대화 중 창밖을 볼 때) */
async function turnTo(look){ W.target = {x:W.pos.x, z:W.pos.z, look}; await new Promise(r => W.onArrive = r); }
/** 바깥을 보여 주는 한 장면 그림 */
async function showCG(src){ const c = $('cg'); if(c.style.opacity==='1'){ c.style.opacity = 0; await sleep(700); } c.src = src; c.style.opacity = 1; stand.style.opacity = 0; await sleep(900); }
const EV = {
  bus_hum(){ hum(55,.12); },
  laundry_hum(){ hum(100,.05); },
  async sit(){ W.sitDrop = -.45; },
  async timeskip(){ await fade(1,900); W.myDrum.visible = false; await sleep(800); await fade(0,900); },
  async flicker(){ for(const ms of [90,60,150]){ W.tubes.forEach(l=>l.intensity=0); await sleep(ms); W.tubes.forEach(l=>l.intensity=.75); await sleep(70); } },
  async look_out(){ await turnTo([-4,1.5,-1.4]); await showCG('img/out-normal.jpg'); },
  async look_back(){ $('cg').style.opacity = 0; stand.style.opacity = 1; await sleep(500); },
  async outside_2(){ $('cg').style.opacity = 0; await turnTo([-4,1.5,-1.4]); await sleep(300); await showCG('img/out-wrong.jpg'); },
  async backdoor_open(){ $('cg').style.opacity = 0; for(let a=0;a<=.85;a+=.05){ W.back.rotation.y = -a; await sleep(30); } W.backLight.intensity = 2.4; },
  async go_through(){ W.ending = true; },
};

/** 0장 끝: 뒷문을 지나 → 초록 글자 화면 */
async function finish(){
  mode = 'end'; hum(0,0); $('hint').style.opacity = 0; $('cross').style.display = 'none';
  await walkTo([3.6,-1.75],[4.6,1.3,-1.75]); W.backLight.intensity = 8; await sleep(600); await fade(1,500);
  const E = $('end'); E.style.display='block'; $('fade').style.opacity = 0; E.textContent = '';
  for(const l of ['C:\\>', '', '', '              1장으로 이어짐']){ for(const ch of l){ E.textContent += ch; tone(900,.02,'square',.03); await sleep(30); } E.textContent += '\n'; await sleep(400); }
}

// ───────────────────────── 루프 ─────────────────────────
function loop(){
  const dt = Math.min(clock.getDelta(), .05);
  if(mode==='laundry' || mode==='end'){
    stepPlayer(dt);
    TEX.drumDry.rotation -= dt*3.2;
    if(W.myDrum.visible) TEX.drumWash.rotation -= dt*4;
    stepKeys(dt);
    renderer.render(scene, camera);
  }
  requestAnimationFrame(loop);
}

// ───────────────────────── 시작 ─────────────────────────
/** 그림·대본 불러오기 */
async function load(){
  const img = src => new Promise((res,rej) => loader.load(src, t => res(px(t)), undefined, () => rej(new Error(src))));
  [TEX.floor, TEX.washer, TEX.vending, TEX.seoaStand, TEX.seoaSit, TEX.drumWash, TEX.drumDry, TEX.board] = await Promise.all(
    ['img/tex-floor.jpg','img/tex-washer.jpg','img/tex-vending.jpg','img/seoa-full.png','img/seoa-sit.png','img/tex-drum-wash.jpg','img/tex-drum-dry.jpg','img/tex-board.jpg'].map(img));
  [TEX.drumWash, TEX.drumDry].forEach(t => t.center.set(.5,.5));   // 가운데를 축으로 돌림
  ['calm','smile','worry'].forEach(f => { new Image().src = `img/vn-seoa-${f}.png`; });   // 미리 받아 두기
  ['img/bg-bus.jpg','img/out-normal.jpg','img/out-wrong.jpg'].forEach(s => { new Image().src = s; });
  // 비공개 아티팩트에서는 대본이 같은 폴더에 있음 → 먼저 시도, 없으면 레포의 비밀 폴더
  let r = await fetch('v4-ch0.ink').catch(() => null);
  if(!r || !r.ok) r = await fetch(INK_URL);
  const c = new inkjs.Compiler(await r.text()); story = c.Compile();
  if(c.errors.length) throw new Error(c.errors.join('\n'));
}
/** 빨래방으로 */
async function enterLaundry(){
  buildLaundry(); mode = 'laundry'; await fade(0,1000);
  await runKnot('laundry_enter');
  $('hint').style.opacity = 1; $('cross').style.display = 'block'; setTimeout(() => $('hint').style.opacity = 0, 6000);
}
const ready = load().catch(e => { $('err').textContent = '불러오기 실패: ' + e.message + '\n(builds/digital-circus 폴더를 서버 루트로 열어야 대본을 읽을 수 있어)'; });
loop();
$('start').addEventListener('pointerup', async e => {
  e.stopPropagation(); initAudio(); $('start').style.display = 'none'; await ready; if(!story) return;
  if(new URLSearchParams(location.search).get('scene') !== 'laundry') await playBus();   // 확인용: ?scene=laundry
  await enterLaundry();
});
</script>
