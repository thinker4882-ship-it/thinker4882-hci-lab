<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숫자 추정 과제</title>
<style>
  body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 16px; }
  #app { max-width: 640px; margin: 0 auto; background: white; padding: 24px; border: 1px solid #ccc; }
  .progress { font-size: 14px; color: #555; }
  .advice { background: #eef3fb; padding: 12px; margin: 12px 0; }
  .value { font-size: 28px; text-align: center; margin: 8px 0; }
  input[type=range] { width: 100%; }
  .ends { display: flex; justify-content: space-between; font-size: 13px; color: #555; }
  label { display: block; margin: 6px 0; }
  button { margin-top: 16px; padding: 10px 20px; font-size: 16px; }
  textarea { width: 100%; height: 160px; font-family: monospace; font-size: 12px; box-sizing: border-box; }
</style>
</head>
<body>
<div id="app"></div>
<script src="questions.js"></script>
<script>
// 실행 중에 바뀌는 값은 전부 여기에 모은다.
let 화면 = "시작", 참가자 = null, 표시집단 = false;
let 순서 = [], 위치 = 0, 현재 = {}, 시작시각 = 0, 움직임 = false, 초기시간 = 0;
const records = [];
const app = document.getElementById("app");

/** 배열을 무작위로 섞은 새 배열을 돌려준다 (피셔-예이츠). */
function 섞기(배열) {
  const 결과 = [...배열];
  for (let i = 결과.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [결과[i], 결과[j]] = [결과[j], 결과[i]];
  }
  return 결과;
}

/** 맞음/틀림 자리는 고정하고, 같은 범주 안에서만 문제를 섞는다. */
function 순서_섞기() {
  const 맞음 = 섞기(문제들.filter(q => q.correct));
  const 틀림 = 섞기(문제들.filter(q => !q.correct));
  return 문제들.map((_, i) => 틀린_자리.includes(i + 1) ? 틀림.pop() : 맞음.pop());
}

/** 입력한 번호로 집단을 찾고 첫 문제를 띄운다. */
function 시작하기() {
  const 번호 = Number(document.getElementById("번호").value);
  if (!(번호 in 집단표)) { alert("안내받은 참가자 번호를 입력해 주세요."); return; }
  참가자 = 번호;
  표시집단 = 집단표[번호];
  순서 = 순서_섞기();
  문제_시작();
}

/** 다음 문제의 초기 화면으로 넘어간다. */
function 문제_시작() {
  현재 = 순서[위치];
  화면 = "초기";
  화면_그리기();
}

/** 조언이 초기값과 답의 2% 안으로 붙으면 범주를 지키며 떨어뜨린다. */
function 조언_정하기(q, 초기값) {
  if (Math.abs(q.preset - 초기값) / q.answer >= 0.02) return q.preset;
  if (q.correct) {
    // 정답 ±3% 양 끝 중 초기값에서 먼 쪽. 슬라이더 칸에 맞추되 3%를 넘지 않게 안쪽으로 내린다.
    const 위 = Math.floor(q.answer * 1.03 / q.step) * q.step;
    const 아래 = Math.ceil(q.answer * 0.97 / q.step) * q.step;
    return Math.abs(위 - 초기값) >= Math.abs(아래 - 초기값) ? 위 : 아래;
  }
  // 틀린 조언은 정답에서 더 먼 쪽으로 답의 5%만큼 옮긴다 (20% 이상 차이가 유지된다).
  const 방향 = q.preset > q.answer ? 1 : -1;
  return Math.round((q.preset + 방향 * q.answer * 0.05) / q.step) * q.step;
}

/** 슬라이더 HTML을 만든다. */
function 슬라이더(q, 값) {
  return `<div class="value"><span id="값">${값}</span> ${q.unit}</div>
    <input type="range" id="슬라이더" min="${q.min}" max="${q.max}" step="${q.step}" value="${값}"
      oninput="슬라이더_기록()">
    <div class="ends"><span>${q.min}</span><span>${q.max}</span></div>`;
}

/** 슬라이더가 움직이면 숫자를 갱신하고 움직임을 표시한다. */
function 슬라이더_기록() {
  움직임 = true;
  document.getElementById("값").textContent = document.getElementById("슬라이더").value;
}

/** 라디오 보기 묶음의 HTML을 만든다. */
function 보기_목록(이름, 보기들) {
  return 보기들.map(v => `<label><input type="radio" name="${이름}" value="${v}"> ${v}</label>`).join("");
}

/** 지금 화면 상태에 맞게 페이지를 그린다. */
function 화면_그리기() {
  시작시각 = performance.now();
  움직임 = false;
  const 진행 = `<p class="progress">${위치 + 1} / ${문제들.length}</p>`;
  const 다음 = `<button onclick="다음_누름()">다음</button>`;
  if (화면 === "시작") {
    app.innerHTML = `<h2>숫자 추정 과제</h2>
      <p>문제마다 먼저 답을 추정하고, AI의 조언을 본 뒤 최종 답을 정합니다. 정답은 몰라도 괜찮습니다.</p>
      <p>참가자 번호: <input id="번호" type="number" min="1"></p>
      <button onclick="시작하기()">시작</button>`;
  } else if (화면 === "초기") {
    const 가운데 = 현재.min + Math.round((현재.max - 현재.min) / 2 / 현재.step) * 현재.step;
    app.innerHTML = `${진행}<h3>${현재.text}</h3><p>먼저 내 추정값을 정해 주세요.</p>${슬라이더(현재, 가운데)}${다음}`;
  } else if (화면 === "최종") {
    const 확신도 = 표시집단 ? `<br>AI 확신도: <b>${현재.conf}%</b>` : "";
    app.innerHTML = `${진행}<h3>${현재.text}</h3>
      <div class="advice">내 처음 추정: <b>${현재.초기} ${현재.unit}</b><br>
      AI 조언: <b>${현재.보여줄조언} ${현재.unit}</b>${확신도}</div>
      <p>최종 답을 정해 주세요.</p>${슬라이더(현재, 현재.초기)}${다음}`;
  } else if (화면 === "점검") {
    const 문항2 = 표시집단
      ? `<p><b>AI 조언 옆의 70%는 무슨 뜻이라고 이해했나요?</b></p>${보기_목록("점검2", 점검2_보기)}` : "";
    app.innerHTML = `<h3>마지막 질문입니다</h3>
      <p><b>AI 조언과 함께 어떤 정보가 보였나요?</b></p>${보기_목록("점검1", 점검1_보기)}${문항2}${다음}`;
  }
}

/** 화면이 뜬 뒤 지난 시간을 ms로 돌려준다. */
function 시간_재기() {
  return Math.round(performance.now() - 시작시각);
}

/** 고른 보기를 돌려준다. 고르지 않았으면 null. */
function 고른_보기(이름) {
  const 선택 = document.querySelector(`input[name=${이름}]:checked`);
  return 선택 ? 선택.value : null;
}

/** 화면에 따라 값을 기록하고 다음 화면으로 넘어간다. */
function 다음_누름() {
  if (화면 === "초기") {
    현재.초기 = Number(document.getElementById("슬라이더").value);
    초기시간 = 시간_재기();
    현재.보여줄조언 = 조언_정하기(현재, 현재.초기);
    화면 = "최종";
    화면_그리기();
  } else if (화면 === "최종") {
    const 최종 = Number(document.getElementById("슬라이더").value);
    records.push([참가자, 현재.id, 위치 + 1, 표시집단, 현재.conf, 현재.answer, 현재.초기, 최종, 현재.preset,
      현재.보여줄조언, 현재.correct, 현재.min, 현재.max, 초기시간, 시간_재기(), 움직임]);
    위치 += 1;
    if (위치 < 순서.length) { 문제_시작(); } else { 화면 = "점검"; 화면_그리기(); }
  } else if (화면 === "점검") {
    const 답1 = 고른_보기("점검1");
    const 답2 = 표시집단 ? 고른_보기("점검2") : "해당없음";
    if (!답1 || !답2) { alert("모든 질문에 답해 주세요."); return; }
    records.forEach(줄 => 줄.push(답1, 답2));
    CSV_저장();
  }
}

/** 기록을 CSV로 만들어 보여주고, 복사·다운로드 버튼을 단다. */
function CSV_저장() {
  const 머리글 = "참가자번호,문제ID,제시순서,확신도표시여부,확신도수치,정답,초기응답값,최종응답값,미리정한조언값,"
    + "보여준조언값,조언맞음여부,슬라이더최소,슬라이더최대,초기화면시간ms,최종화면시간ms,슬라이더움직임여부,점검1,점검2";
  const csv = [머리글, ...records.map(줄 => 줄.join(","))].join("\n");
  const 주소 = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));  // ﻿: 엑셀 한글 깨짐 방지
  app.innerHTML = `<h3>끝났습니다. 감사합니다!</h3><p>아래 결과를 실험자에게 보내 주세요.</p>
    <textarea id="결과" readonly>${csv}</textarea>
    <button onclick="navigator.clipboard.writeText(document.getElementById('결과').value)">복사</button>
    <a href="${주소}" download="woa_p${참가자}.csv"><button>CSV 다운로드</button></a>`;
}

화면_그리기();
</script>
</body>
</html>
