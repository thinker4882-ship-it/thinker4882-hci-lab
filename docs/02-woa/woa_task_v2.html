<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가격 추정 과제</title>
<style>
  body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 16px; }
  #app { max-width: 640px; margin: 0 auto; background: white; padding: 24px; border: 1px solid #ccc; }
  .progress { font-size: 14px; color: #555; }
  .advice { background: #eef3fb; padding: 12px; margin: 12px 0; }
  .value { font-size: 28px; text-align: center; margin: 8px 0; }
  .value input { width: 160px; font-size: 24px; padding: 6px; text-align: right; }
  label { display: block; margin: 6px 0; }
  button { margin-top: 16px; padding: 10px 20px; font-size: 16px; }
  textarea { width: 100%; height: 160px; font-family: monospace; font-size: 12px; box-sizing: border-box; }
  .warn { background: #fde8e8; color: #a00; padding: 8px; }
</style>
</head>
<body>
<div id="app"></div>
<!-- v2: 생활 물가 문제. v1(woa_task.html)과 다른 곳은 조언_정하기, 문제 문구, 미리정한조언값 기록 세 군데 -->
<script src="questions_v2.js"></script>
<script>
// 실행 중에 바뀌는 값은 전부 여기에 모은다.
let 화면 = "시작", 참가자 = null, 표시집단 = false;
let 순서 = [], 위치 = 0, 현재 = {}, 시작시각 = 0, 초기시간 = 0;
const records = [];
const app = document.getElementById("app");

/** 배열을 무작위로 섞은 새 배열을 돌려준다 (피셔-예이츠). */
function 섞기(배열) {
  const 결과 = [...배열];
  for (let i = 결과.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [결과[i], 결과[j]] = [결과[j], 결과[i]];
  }
  return 결과;
}

/** 맞음/틀림 자리는 고정하고, 같은 범주 안에서만 문제를 섞는다. */
function 순서_섞기() {
  const 맞음 = 섞기(문제들.filter(q => q.correct));
  const 틀림 = 섞기(문제들.filter(q => !q.correct));
  return 문제들.map((_, i) => 틀린_자리.includes(i + 1) ? 틀림.pop() : 맞음.pop());
}

/** 입력한 번호로 집단을 찾고 첫 문제를 띄운다. */
function 시작하기() {
  const 번호 = Number(document.getElementById("번호").value);
  if (!(번호 in 집단표)) { alert("안내받은 참가자 번호를 입력해 주세요."); return; }
  참가자 = 번호;
  표시집단 = 집단표[번호];
  순서 = 순서_섞기();
  문제_시작();
}

/** 다음 문제의 초기 화면으로 넘어간다. */
function 문제_시작() {
  현재 = 순서[위치];
  화면 = "초기";
  화면_그리기();
}

/** 맞는 조언은 정답, 틀린 조언은 초기값에서 정답 반대쪽으로 20% 더 간 값을 돌려준다. */
function 조언_정하기(q, 초기값) {
  if (q.correct) return q.answer;  // M-12: 맞는 조언 = 정답 그대로
  // 방향: 정답에서 초기값 쪽으로 (+1 = 위, -1 = 아래). 그래야 정답 — 초기값 — 조언 순서가 된다.
  let 방향 = Math.sign(초기값 - q.answer);
  if (방향 === 0) 방향 = Math.random() < 0.5 ? 1 : -1;  // M-6: 초기값 = 정답이면 무작위
  let 조언 = Math.round(초기값 * (1 + 방향 * 틀린_거리) / q.step) * q.step;
  if (조언 === 초기값) 조언 += 방향 * q.step;  // 반올림 때문에 초기값과 같아지면 한 단위 더 민다
  if (조언 <= 0) 조언 = 초기값 * (1 - 틀린_거리);  // 아주 작은 초기값에서 0 이하가 되는 것을 막는다
  return 조언;
}

/** 숫자 입력칸 HTML을 만든다. inputmode: 패드·휴대폰에서 숫자 키패드를 띄운다. */
function 입력칸(q, 값) {
  return `<div class="value"><input type="number" id="입력" min="1" inputmode="decimal" value="${값}"> 원</div>`;
}

/** 입력칸의 값을 숫자로 읽는다. 0보다 큰 숫자가 아니면 경고하고 null. */
function 입력값_읽기() {
  const 값 = Number(document.getElementById("입력").value);
  if (!(값 > 0)) { alert("0보다 큰 숫자를 입력해 주세요."); return null; }
  return 값;
}

/** 라디오 보기 묶음의 HTML을 만든다. */
function 보기_목록(이름, 보기들) {
  return 보기들.map(v => `<label><input type="radio" name="${이름}" value="${v}"> ${v}</label>`).join("");
}

/** 지금 화면 상태에 맞게 페이지를 그린다. */
function 화면_그리기() {
  시작시각 = performance.now();
  const 진행 = `<p class="progress">${위치 + 1} / ${문제들.length}</p>`;
  const 다음 = `<button onclick="다음_누름()">다음</button>`;
  if (화면 === "시작") {
    // 정답을 확인하지 않은 문제가 있으면 실험자에게 경고한다 (시험용으로만 쓸 것)
    const 미확인 = 문제들.filter(q => !q.checked).length;
    const 경고 = 미확인 ? `<p class="warn">정답 미확인 문제 ${미확인}개 — 시험용입니다. 본 수집 전에 questions_v2.js의 가격을 확인하세요.</p>` : "";
    app.innerHTML = `${경고}<h2>가격 추정 과제</h2>
      <p>물건의 가격을 먼저 추정하고, AI의 조언을 본 뒤 최종 답을 정합니다. 정답은 몰라도 괜찮습니다.</p>
      <p>가격은 ${기준_시점} 기준 정가(공식 가격)입니다.</p>
      <p>참가자 번호: <input id="번호" type="number" min="1"></p>
      <button onclick="시작하기()">시작</button>`;
  } else if (화면 === "초기") {
    app.innerHTML = `${진행}<h3>${현재.text}의 가격은 얼마일까요?</h3><p>먼저 내 추정값을 입력해 주세요.</p>${입력칸(현재, "")}${다음}`;
  } else if (화면 === "최종") {
    const 확신도 = 표시집단 ? `<br>AI 확신도: <b>${현재.conf}%</b>` : "";
    app.innerHTML = `${진행}<h3>${현재.text}의 가격은 얼마일까요?</h3>
      <div class="advice">내 처음 추정: <b>${현재.초기.toLocaleString()} 원</b><br>
      AI 조언: <b>${현재.보여줄조언.toLocaleString()} 원</b>${확신도}</div>
      <p>최종 답을 입력해 주세요. 그대로 두면 처음 추정이 최종 답이 됩니다.</p>${입력칸(현재, 현재.초기)}${다음}`;
  } else if (화면 === "점검") {
    const 문항2 = 표시집단
      ? `<p><b>AI 조언 옆의 70%는 무슨 뜻이라고 이해했나요?</b></p>${보기_목록("점검2", 점검2_보기)}` : "";
    app.innerHTML = `<h3>마지막 질문입니다</h3>
      <p><b>AI 조언과 함께 어떤 정보가 보였나요?</b></p>${보기_목록("점검1", 점검1_보기)}${문항2}${다음}`;
  }
}

/** 화면이 뜬 뒤 지난 시간을 ms로 돌려준다. */
function 시간_재기() {
  return Math.round(performance.now() - 시작시각);
}

/** 고른 보기를 돌려준다. 고르지 않았으면 null. */
function 고른_보기(이름) {
  const 선택 = document.querySelector(`input[name=${이름}]:checked`);
  return 선택 ? 선택.value : null;
}

/** 화면에 따라 값을 기록하고 다음 화면으로 넘어간다. */
function 다음_누름() {
  if (화면 === "초기") {
    const 초기 = 입력값_읽기();
    if (초기 === null) return;
    현재.초기 = 초기;
    초기시간 = 시간_재기();
    현재.보여줄조언 = 조언_정하기(현재, 현재.초기);
    화면 = "최종";
    화면_그리기();
  } else if (화면 === "최종") {
    const 최종 = 입력값_읽기();
    if (최종 === null) return;
    records.push([참가자, 현재.id, 위치 + 1, 표시집단, 현재.conf, 현재.answer, 현재.초기, 최종, 현재.correct ? 현재.answer : "",
      현재.보여줄조언, 현재.correct, 초기시간, 시간_재기(), 최종 !== 현재.초기]);
    위치 += 1;
    if (위치 < 순서.length) { 문제_시작(); } else { 화면 = "점검"; 화면_그리기(); }
  } else if (화면 === "점검") {
    const 답1 = 고른_보기("점검1");
    const 답2 = 표시집단 ? 고른_보기("점검2") : "해당없음";
    if (!답1 || !답2) { alert("모든 질문에 답해 주세요."); return; }
    records.forEach(줄 => 줄.push(답1, 답2));
    CSV_저장();
  }
}

/** 기록을 CSV로 만들어 보여주고, 복사·다운로드 버튼을 단다. */
function CSV_저장() {
  const 머리글 = "참가자번호,문제ID,제시순서,확신도표시여부,확신도수치,정답,초기응답값,최종응답값,미리정한조언값,"
    + "보여준조언값,조언맞음여부,초기화면시간ms,최종화면시간ms,최종값변경여부,점검1,점검2";
  const csv = [머리글, ...records.map(줄 => 줄.join(","))].join("\n");
  const 주소 = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));  // ﻿: 엑셀 한글 깨짐 방지
  app.innerHTML = `<h3>끝났습니다. 감사합니다!</h3><p>아래 결과를 실험자에게 보내 주세요.</p>
    <textarea id="결과" readonly>${csv}</textarea>
    <button onclick="navigator.clipboard.writeText(document.getElementById('결과').value)">복사</button>
    <a href="${주소}" download="woa_p${참가자}.csv"><button>CSV 다운로드</button></a>`;
}

화면_그리기();
</script>
</body>
</html>
